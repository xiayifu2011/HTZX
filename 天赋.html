<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>天赋系统 · 可视化模拟器</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body{
    background:#121417;
    color:#e2e5e9;
    font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width:1100px;
    margin:60px auto;
    padding:0 24px;
    line-height:1.75;
    position: relative;
    overflow-x:hidden;
}
#bgCanvas{
    position: fixed;
    left:0;
    top:0;
    width:100vw;
    height:100vh;
    z-index:-1;
    opacity:0.22;
    pointer-events: none;
}
h1{
    font-size:2.2rem;
    margin-bottom:6px;
}
.subtitle{
    color:#9ca3af;
    margin-bottom:28px;
    font-size:1.05rem;
}

/* 左右两栏 */
.layout{
    display:grid;
    grid-template-columns:1fr 380px;
    gap:24px;
    align-items:start;
}

.section-title{
    font-size:1.2rem;
    margin:0 0 14px;
    border-bottom:1px solid #2a2e36;
    padding-bottom:6px;
    color:#c4b5fd;
}

/* 天赋卡片 */
.talent-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:12px;
    margin-bottom:24px;
}
.talent-card{
    background:#181b20;
    border:1px solid #2a2e36;
    border-radius:10px;
    padding:14px 16px;
    cursor:pointer;
    transition:0.15s;
    user-select:none;
    position:relative;
}
.talent-card:hover{
    border-color:#8b5cf6;
    transform:translateY(-2px);
}
.talent-card.owned{
    background:rgba(139,92,246,0.15);
    border-color:#8b5cf6;
}
.talent-card.blocked{
    opacity:0.45;
    border-style:dashed;
}
.talent-name{
    font-size:1.05rem;
    font-weight:600;
    color:#e2e5e9;
    margin-bottom:4px;
}
.talent-card.owned .talent-name{
    color:#c4b5fd;
}
.talent-meta{
    font-size:0.82rem;
    color:#9ca3af;
}
.talent-color{
    display:inline-block;
    padding:1px 8px;
    border-radius:20px;
    font-size:0.75rem;
    margin-left:6px;
    border:1px solid;
}
.color-2{color:#93c5fd; border-color:#3b82f6; background:rgba(59,130,246,0.1);}
.color-3{color:#c4b5fd; border-color:#8b5cf6; background:rgba(139,92,246,0.1);}
.color-4{color:#fcd34d; border-color:#f59e0b; background:rgba(245,158,11,0.1);}
.color-5{color:#f87171; border-color:#ef4444; background:rgba(239,68,68,0.1);}

.talent-badge{
    position:absolute;
    top:10px;
    right:12px;
    font-size:0.7rem;
    padding:2px 8px;
    border-radius:20px;
}
.badge-owned{background:#8b5cf6; color:white;}
.badge-blocked{background:#3f3f46; color:#d4d4d8;}

/* 按钮 */
button.btn{
    display:block;
    width:100%;
    padding:12px 16px;
    background:#8b5cf6;
    color:white;
    border:none;
    border-radius:8px;
    text-align:center;
    font-size:1.05rem;
    font-family:inherit;
    transition:0.15s;
    cursor:pointer;
    margin-bottom:10px;
}
button.btn:hover{
    background:#7c3aed;
    transform:scale(1.02);
}
button.btn.secondary{
    background:#272a30;
    color:#e5e7eb;
}
button.btn.secondary:hover{
    background:#33373f;
}

/* 右栏：属性面板 */
.property-panel{
    background:#181b20;
    border:1px solid #2a2e36;
    border-radius:10px;
    padding:16px 18px;
    margin-bottom:16px;
}
.property-item{
    margin-bottom:12px;
}
.property-item:last-child{
    margin-bottom:0;
}
.property-label{
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:#9ca3af;
    font-size:0.9rem;
    margin-bottom:4px;
}
.property-value{
    font-size:1.3rem;
    font-weight:600;
    color:#c4b5fd;
}
.property-bar{
    height:6px;
    background:#272a30;
    border-radius:3px;
    overflow:hidden;
}
.property-bar-fill{
    height:100%;
    background:#8b5cf6;
    border-radius:3px;
    transition:width 0.4s ease;
}
.property-bar-fill.over{
    background:#f59e0b;
}
.property-bar-fill.low{
    background:#f87171;
}

/* 日志 */
.log-box{
    background:#181b20;
    border:1px solid #2a2e36;
    border-radius:10px;
    padding:14px 16px;
    max-height:260px;
    overflow-y:auto;
    font-size:0.88rem;
    color:#b0b8c4;
    font-family:"Fira Code","Cascadia Code",monospace;
}
.log-box .empty{
    color:#6b7280;
}
.log-line{
    padding:3px 0;
    border-bottom:1px dashed #2a2e36;
}
.log-line:last-child{
    border-bottom:none;
}
.log-ok{color:#4ade80;}
.log-fail{color:#f87171;}
.log-info{color:#a78bfa;}

/* 提示 */
.hint{
    color:#6b7280;
    font-size:0.85rem;
    margin-bottom:14px;
}

@media (max-width:860px){
    .layout{
        grid-template-columns:1fr;
    }
    .talent-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>

<h1>天赋系统 <span style="font-size:0.9rem; color:#a78bfa; font-weight:400;">Visualizer</span></h1>
<div class="subtitle">点击天赋卡片解锁 / 删除，右侧实时显示属性与冲突处理结果</div>

<div class="layout">
    <!-- 左栏：天赋 -->
    <div>
        <h2 class="section-title">🧬 天赋列表</h2>
        <div class="hint">点击卡片切换拥有状态。矛盾天赋会按颜色等级自动处理。</div>
        <div class="talent-grid" id="talentGrid"></div>

        <h2 class="section-title">⚙️ 操作</h2>
        <button class="btn secondary" onclick="resetAll()">重置全部天赋</button>
        <button class="btn secondary" onclick="recalc()">重新计算属性</button>
    </div>

    <!-- 右栏：属性 + 日志 -->
    <div>
        <h2 class="section-title">📊 属性面板</h2>
        <div class="property-panel" id="propertyPanel"></div>

        <h2 class="section-title">📝 处理日志</h2>
        <div class="log-box" id="logBox">
            <div class="empty">还没有操作记录。</div>
        </div>
    </div>
</div>

<script>
// ====================== 01字符串流动背景 ======================
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let w, h, columns, drops = [], speeds = [];
const fontSize = 16;

function resizeCanvas(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    columns = Math.floor(w / fontSize);
    drops = Array(columns).fill(0).map(() => Math.random() * -100);
    speeds = Array(columns).fill(0).map(() => 0.5 + Math.random() * 1.2);
}
function drawMatrix(){
    ctx.fillStyle = 'rgba(18,20,23,0.07)';
    ctx.fillRect(0,0,w,h);
    ctx.font = fontSize + 'px "Fira Code", "Cascadia Code", monospace';
    ctx.textBaseline = 'top';
    for(let i = 0; i < columns; i++){
        const char = Math.random() > 0.5 ? '1' : '0';
        const x = i * fontSize;
        const y = drops[i] * fontSize;
        const brightness = 0.6 + (Math.sin(i * 0.5 + Date.now() * 0.002) * 0.2);
        ctx.fillStyle = `rgba(167, 139, 250, ${brightness})`;
        if (Math.random() > 0.98) ctx.fillStyle = '#c4b5fd';
        ctx.fillText(char, x, y);
        if(y > h && Math.random() > 0.975){
            drops[i] = Math.random() * -20;
            speeds[i] = 0.5 + Math.random() * 1.2;
        } else {
            drops[i] += speeds[i] * 0.8;
        }
    }
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
let lastTime = 0;
const interval = 45;
function animate(t){
    if(!lastTime) lastTime = t;
    if(t - lastTime >= interval){ drawMatrix(); lastTime = t; }
    requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

// ====================== 天赋数据（对应 C++ prepare） ======================
const TALENTS = [
    { name:'道心如铁', color:5, inconsistent:['玻璃心','内耗者'] },
    { name:'高冷',     color:2, inconsistent:['社交牛逼症'] },
    { name:'社交牛逼症', color:4, inconsistent:['高冷'] },
    { name:'玻璃心',   color:2, inconsistent:['道心如铁'] },
    { name:'内耗者',   color:3, inconsistent:['道心如铁'] },
    // 代码里出现但未在 prepare 中定义的，一并列出，方便观察
    { name:'家财万贯', color:4, inconsistent:[] },
    { name:'家徒四壁', color:2, inconsistent:[] },
    { name:'大胃袋',   color:3, inconsistent:[] },
    { name:'钢筋铁骨', color:4, inconsistent:[] },
    { name:'天行健',   color:5, inconsistent:[] },
    { name:'体弱多病', color:2, inconsistent:[] },
    { name:'多动症',   color:3, inconsistent:[] },
    { name:'热情',     color:3, inconsistent:[] },
    { name:'爱装逼',   color:2, inconsistent:[] }
];

// 名称 -> 天赋
const TALENT_MAP = {};
TALENTS.forEach(t => TALENT_MAP[t.name] = t);

// ====================== 状态 ======================
let owned = {};          // 名字 -> true/false
let cannotBeOwn = {};    // 名字 -> true/false
let logs = [];

function log(msg, type='info'){
    logs.push({ msg, type, time: new Date().toLocaleTimeString() });
    renderLog();
}

function renderLog(){
    const box = document.getElementById('logBox');
    if(logs.length === 0){
        box.innerHTML = '<div class="empty">还没有操作记录。</div>';
        return;
    }
    box.innerHTML = logs.map(l =>
        `<div class="log-line log-${l.type}">[${l.time}] ${l.msg}</div>`
    ).join('');
    box.scrollTop = box.scrollHeight;
}

// ====================== 冲突处理（对应 solve_conflict） ======================
// 用优先队列：颜色高优先，颜色相同按名字
function solveConflict(){
    // 重置
    cannotBeOwn = {};
    owned = {};

    // 取出所有“已拥有”的天赋，按颜色从高到低排序
    const queue = TALENTS
        .filter(t => t._pushed)
        .sort((a, b) => {
            if(b.color !== a.color) return b.color - a.color;
            return a.name.localeCompare(b.name);
        });

    for(const t of queue){
        if(!cannotBeOwn[t.name]){
            owned[t.name] = true;
            for(const inc of t.inconsistent){
                cannotBeOwn[inc] = true;
            }
        }
    }
}

// ====================== 解锁 / 删除 ======================
function unlock(name){
    const t = TALENT_MAP[name];
    if(!t) return false;
    t._pushed = true;
    owned[name] = true;
    solveConflict();

    const ok = !!owned[name];
    if(ok){
        log(`解锁「${name}」成功`, 'ok');
    } else {
        log(`解锁「${name}」失败（被更高等级矛盾项压制）`, 'fail');
    }
    return ok;
}

function del(name){
    const t = TALENT_MAP[name];
    if(!t) return;
    t._pushed = false;
    solveConflict();
    log(`删除「${name}」`, 'info');
}

// ====================== 属性计算（对应 prepaer_property） ======================
function rand(min, max){
    return Math.floor(Math.random() * (max - min + 1)) + min;
}
function randPercent20(){ return rand(-10, 9); } // rand()%20 - 10
function randPercent5(){ return rand(0, 4); }     // rand()%5
function randPercent10(){ return rand(-5, 4); }   // rand()%10 - 5

let PROPERTY = {
    '心态': 100,
    '经济': 100,
    '健康': 100,
    '效率': 100,
    '社交': 100
};

function calcProperty(){
    solveConflict();

    // 心态
    if(owned['道心如铁']){
        PROPERTY['心态'] = 130;
    } else {
        PROPERTY['心态'] += randPercent20();
    }
    PROPERTY['心态'] = Math.min(150, PROPERTY['心态']);

    // 经济
    if(owned['家财万贯']){
        PROPERTY['经济'] += 150;
    } else {
        PROPERTY['经济'] += randPercent20()
            - 10 * (owned['家徒四壁'] ? 1 : 0)
            - 10 * (owned['大胃袋'] ? 1 : 0);
    }
    PROPERTY['经济'] = Math.max(0, PROPERTY['经济']);

    // 健康
    if(owned['钢筋铁骨'] || owned['天行健']){
        PROPERTY['健康'] = 130;
    } else {
        PROPERTY['健康'] += randPercent20()
            - randPercent5() * (owned['体弱多病'] ? 1 : 0)
            + 10 * (owned['大胃袋'] ? 1 : 0);
    }
    PROPERTY['健康'] = Math.min(150, PROPERTY['健康']);

    // 效率
    if(owned['天行健']){
        PROPERTY['效率'] = 130;
    } else {
        PROPERTY['效率'] += randPercent20()
            + (PROPERTY['健康'] - 100)
            - 20 * (owned['多动症'] ? 1 : 0);
    }
    PROPERTY['效率'] = Math.min(150, PROPERTY['健康']);

    // 社交
    if(owned['社交牛逼症']){
        PROPERTY['社交'] = 130;
    } else {
        PROPERTY['社交'] += randPercent20()
            - 5 * (owned['高冷'] ? 1 : 0)
            + 10 * (owned['热情'] ? 1 : 0)
            - randPercent10() * (owned['爱装逼'] ? 1 : 0);
    }
    PROPERTY['社交'] = Math.min(150, PROPERTY['社交']);
    PROPERTY['社交'] = Math.max(10, PROPERTY['社交']);

    renderProperty();
    log('属性已重新计算', 'info');
}

// ====================== 渲染 ======================
function renderTalents(){
    const grid = document.getElementById('talentGrid');
    grid.innerHTML = TALENTS.map(t => {
        const isOwned = !!owned[t.name];
        const isBlocked = !!cannotBeOwn[t.name] && !isOwned;
        let cls = 'talent-card';
        if(isOwned) cls += ' owned';
        if(isBlocked) cls += ' blocked';
        let badge = '';
        if(isOwned) badge = '<span class="talent-badge badge-owned">拥有</span>';
        else if(isBlocked) badge = '<span class="talent-badge badge-blocked">被压制</span>';
        return `
            <div class="${cls}" onclick="toggle('${t.name}')">
                ${badge}
                <div class="talent-name">
                    ${t.name}
                    <span class="talent-color color-${t.color}">Lv.${t.color}</span>
                </div>
                <div class="talent-meta">
                    矛盾：${t.inconsistent.length ? t.inconsistent.join('、') : '无'}
                </div>
            </div>
        `;
    }).join('');
}

function renderProperty(){
    const panel = document.getElementById('propertyPanel');
    const order = ['心态','经济','健康','效率','社交'];
    panel.innerHTML = order.map(k => {
        const v = PROPERTY[k];
        let pct = Math.min(100, v / 150 * 100);
        let cls = 'property-bar-fill';
        if(v >= 130) cls += ' over';
        else if(v < 60) cls += ' low';
        return `
            <div class="property-item">
                <div class="property-label">
                    <span>${k}</span>
                    <span class="property-value">${v}</span>
                </div>
                <div class="property-bar">
                    <div class="${cls}" style="width:${pct}%"></div>
                </div>
            </div>
        `;
    }).join('');
}

// ====================== 交互 ======================
function toggle(name){
    const t = TALENT_MAP[name];
    if(!t) return;
    if(t._pushed){
        del(name);
    } else {
        unlock(name);
    }
    renderTalents();
    recalc();
}

function recalc(){
    // 每次操作都基于当前 owned 重新计算属性
    // 注意：C++ 里属性是累加的，这里为了可视化直观，每次重置为基础值再算
    PROPERTY = { '心态':100, '经济':100, '健康':100, '效率':100, '社交':100 };
    calcProperty();
}

function resetAll(){
    TALENTS.forEach(t => t._pushed = false);
    owned = {};
    cannotBeOwn = {};
    logs = [];
    renderLog();
    renderTalents();
    PROPERTY = { '心态':100, '经济':100, '健康':100, '效率':100, '社交':100 };
    calcProperty();
    log('已重置全部天赋', 'info');
}

// ====================== 初始化 ======================
renderTalents();
renderProperty();
log('天赋系统已加载，点击卡片开始', 'info');

window.addEventListener('load', () => {
    console.log('🧬 天赋系统可视化已加载');
});
</script>

</body>
</html>
