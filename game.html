  <!-- 主循环引擎 -->
  <script>
/* ==== 16-flow.js ==== */
/* ==================================================================
 * 引擎层 · 主循环
 * ==================================================================
 * 一周的完整流程：开周 → 选行动 → 弹事件 → 结算 → 下一周。
 * 事件链（一次一弹、连锁概率）也在这里。
 *
 * 维护等级：引擎层（一般不动）
 * ============================================================ */

    function weekInTerm() {return S.week % (WEEKS_PER_TERM + 1)}

    function gradeName() {return L("grade." + (Math.min(2, Math.floor(S.term / 2)) + 1))}

    function termName() {return (S.term % 2 === 0) ? L("term.up") : L("term.down")}

    function nextWeek() {
      if (S.over) return;
      S.week++;
      saveGame(false);
      startWeek();
    }

    function ensureActionPanel() {
      if (!S || S.over || popupBusy) return;   // 有弹窗正在处理时不补行动面板
      const panel = document.getElementById("actionPanel");
      if (!panel) return;
      if (panel.innerHTML !== "") return;
      const wit = weekInTerm();
      const fixed = fixedEventOf(S.term, wit);
      if (!fixed) offerActions();
    }

    function startWeek() {
      if (S) {
        S.evWeekTotal = 0;           // 新的一周：事件计数清零
        S.evCountWeek = 0;
        S.evCntWeek = {};
        S.actCount = 0;
        S.actQuota = 0;
        flushPending();              // 清掉过期的后续事件
        // 生成本周的时段序列（周中 → 周末，顺序固定；数量可动态增减）
        S.slotPlan = buildWeekSlots();
        S.slotIdx = 0;
        S.slot = S.slotPlan[0];
        S.actQuota = S.slotPlan.length;
      }
      const wit0 = weekInTerm();
      if (S && !fixedEventOf(S.term, wit0)) S.actQuota = num(S.slotPlan && S.slotPlan.length, actionQuota());
      renderHUD();
      if (S.over) return;
      if (S.week > 0 && weekInTerm() === 0 && S.term >= TERMS) {return zhongkao();}
      const wit = weekInTerm();
      const wi = weekInfo(S.week, S.term);
      say(L("flow.weekHead", S.week, gradeName(), termName(), wi.month, wi.seasonIcon, wi.season), "week-head");
      const fixed = fixedEventOf(S.term, wit);
      if (fixed) runFixed(fixed);
      else offerActions();
    }

    /* 是否需要抢社团
     * ------------------------------------------------------------------
     * 规则：
     *   1. 只在「上学期」开放（初一上 / 初二上 / 初三上，term 0 / 2 / 4）
     *   2. 窗口是每学期第 3~5 周的周末
     *   3. 整个窗口只弹一次 —— 抢不上就这一年没有社团
     *   4. 已经选中过「不报了」的，这一年不再问
     * ================================================================== */
    function needClubGrab() {
      if (!S) return false;
      const term = clampNum(S.term, 0, 9, 0);
      if (term % 2 !== 0) return false;               // 只有上学期
      if (S.clubTerm === term) return false;          // 这一年已经处理过了
      if (S.clubSkipTerm === term) return false;      // 这一年主动放弃了
      const wit = weekInTerm();
      if (wit < 3 || wit > 5) return false;           // 第 3~5 周
      if (S.slot !== "weekend") return false;
      return true;
    }

    function showClubGrab() {
      S.clubTerm = clampNum(S.term, 0, 9, 0);     // 这一年只问这一次
      const wi = weekInfo(S.week, S.term);
      showPopup({
        kind: "free",
        badge: "🎉 社团 · 周末",
        title: CLUB_GRAB_EVENT.t,
        body: `<div style="line-height:2">${String(CLUB_GRAB_EVENT.c).replace(/\n/g, "<br>")}
          <br><span style="color:var(--dim);font-size:.85rem">${wi.month}月 · ${wi.seasonIcon}${wi.season} · ${gradeName()}上学期 · 报名窗口只有这一次</span></div>`,
        options: (typeof buildClubGrabOpts === "function") ? buildClubGrabOpts() : [{t: "知道了", fn: () => {ensureActionPanel();}}]
      }, () => {ensureActionPanel();});
    }

    function offerActions() {
      // 开学第 3~5 周的周末：抢社团（红塔中学特色，手慢无，每学年上学期一次）
      if (needClubGrab()) {showClubGrab(); return;}

      // 周三社团课：行动选项换成社团专属的
      if (S.slot === "clubday") {offerClubActions(); return;}

      const acts = [
        {k: "study", t: L("act.study")},
        {k: "quiz", t: L("act.quiz")},
        {k: "sport", t: L("act.sport")},
        {k: "rest", t: L("act.rest")},
        {k: "social", t: L("act.social")},
        {k: "fun", t: L("act.fun")},
        {k: "allowance", t: L("act.allowance")},
        {k: "read", t: L("act.read")},
      ];

      const box = document.getElementById("actionPanel");
      const doneN = num(S.actCount, 0), allN = num(S.actQuota, 1);
      const slot = SLOT_MAP[S.slot] || SLOTS[0];
      box.innerHTML = `<div class='tag-title'>${slot.icon} ${slotName(slot)} · ${allN > 1 ? L("act.titleN", doneN + 1, allN) : L("act.title")}</div>`;
      const grid = document.createElement("div");
      grid.className = "actgrid";
      acts.forEach(a => {
        const b = document.createElement("button"); b.className = "btn";
        b.innerHTML = `<b>${a.t}</b>`;
        b.dataset.actKey = "act." + a.k;      // 记住文案键，切语言时原地改字
        b.onclick = () => takeAction(a.k); grid.appendChild(b);
      });
      box.appendChild(grid);
      // 道具不在这里重复列出 —— 用道具请点顶部「🎒 道具」按钮
      renderHUD();
    }

    /* 周三社团课的行动选项
     * 社团活动只在周三下午发生，这里的选项和平时不一样。 */
    function offerClubActions() {
      const c = CLUB_MAP[S.club];
      const box = document.getElementById("actionPanel");
      const doneN = num(S.actCount, 0), allN = num(S.actQuota, 1);
      const slot = SLOT_MAP[S.slot] || SLOTS[0];
      box.innerHTML = `<div class='tag-title'>${slot.icon} ${slotName(slot)}${allN > 1 ? `（${doneN + 1}/${allN}）` : ""}</div>`;

      const grid = document.createElement("div");
      grid.className = "actgrid";

      const mk = (t, sub, fn, key, subKey) => {
        const b = document.createElement("button");
        b.className = "btn";
        b.innerHTML = sub ? `<b>${t}</b><br><small>${sub}</small>` : `<b>${t}</b>`;
        if (key) b.dataset.actKey = key;
        if (subKey) b.dataset.actSubKey = subKey;
        b.onclick = fn;
        grid.appendChild(b);
      };

      mk(`${c ? c.icon : "🎪"} ${L("act.club")}`, c ? TZ(c.n) : "", () => takeAction("club"), "act.club");
      mk(L("act.clubSkip"), L("act.clubSub"), () => takeAction("study"), "act.clubSkip", "act.clubSub");
      mk(L("act.clubRest"), L("act.restSub"), () => takeAction("rest"), "act.clubRest", "act.restSub");
      mk(L("act.clubSocial"), L("act.socialSub"), () => takeAction("social"), "act.clubSocial", "act.socialSub");

      box.appendChild(grid);
      renderHUD();
    }

    /* 切换语言后，把行动按钮上的字原地换成新语言
     * （不能重新 offerActions —— 那会重置本周的行动进度） */

    function relabelActions() {
      const box = document.getElementById("actionPanel");
      if (!box) return;
      box.querySelectorAll("button[data-act-key]").forEach(b => {
        const key = b.dataset.actKey;
        const subKey = b.dataset.actSubKey;
        const icon = (b.textContent.match(/^[^\u4e00-\u9fa5A-Za-z]*/) || [""])[0];
        const t = L(key);
        if (subKey) {
          const small = b.querySelector("small");
          const clubName = small ? small.textContent : "";
          b.innerHTML = `<b>${t}</b><br><small>${L(subKey) || clubName}</small>`;
        } else {
          b.innerHTML = `<b>${t}</b>`;
        }
      });
      // 标题行（含时段名与进度）整体重刷一次
      const tag = box.querySelector(".tag-title");
      if (tag && typeof slotName === "function") {
        const slot = SLOT_MAP[S.slot] || SLOTS[0];
        const allN = num(S.actQuota, 1), doneN = num(S.actCount, 0);
        tag.innerHTML = `${slot.icon} ${slotName(slot)} · ${allN > 1 ? L("act.titleN", doneN + 1, allN) : L("act.title")}`;
      }
    }

    /* 本周可以选几次行动（按学期取配置） */

    function actionQuota() {
      const cfg = GAME_CONFIG.actionsPerWeek;
      const v = cfg[Math.min(cfg.length - 1, Math.max(0, clampNum(S.term, 0, 5)))];
      return Math.max(1, Math.round(num(v, 1)));
    }

    /* 推进到下一个时段（周中 → 周末），返回是否还有时段 */
    function advanceSlot() {
      if (!Array.isArray(S.slotPlan) || !S.slotPlan.length) {
        S.slotPlan = buildWeekSlots(); S.slotIdx = 0; S.slot = S.slotPlan[0];
        S.actQuota = S.slotPlan.length;
        return true;
      }
      S.slotIdx = clampNum(S.slotIdx + 1, 0, S.slotPlan.length - 1);
      if (S.slotIdx >= S.slotPlan.length - 1) S.slotIdx = S.slotPlan.length - 1;
      S.slot = S.slotPlan[S.slotIdx];
      return S.slotIdx < S.slotPlan.length - 1 || S.actCount < S.actQuota;
    }

    /* 当前时段是否已走完（用于判断是否进入下一个时段） */
    function slotDone() {
      if (!Array.isArray(S.slotPlan) || !S.slotPlan.length) return true;
      return (S.slotIdx + 1) > (S.actCount || 0);
    }

    /* 一次「本周行动」：结算 → 1 个事件弹窗 → 可能连锁 1~2 个 → 收尾 */

    function takeAction(k) {
      document.getElementById("actionPanel").innerHTML = "";
      if (k === "read") {openBookCorner(() => afterAction(k)); return;}
      // 「做题」：先弹一道题，答完才算这一周的行动结算完毕
      if (k === "quiz") {openQuiz(() => afterAction(k)); return;}
      // 「运动锻炼」：先结算身体收益，再按概率连锁运动类事件
      if (k === "sport") {sportSettle(() => runSportChain(() => afterAction(k))); return;}
      // 「向父母要零花钱」不产生学力，走单独的结算（弹完再走事件链）
      if (k === "allowance") {allowanceSettle(() => runEventChain(() => afterAction(k))); return;}
      // 「去社团活动」：走社团专属事件（周三社团课）
      if (k === "club") {
        S.actCount = (S.actCount || 0) + 1;
        S.evCntWeek = {};
        S.evCountWeek = 0;
        say(L("flow.clubLog", clubName() || L("flow.club")), "sys");
        renderHUD();
        runClubEvent(() => afterAction(k));
        return;
      }
      studySettle(k);
      say(L("flow.actionLog", (S.actCount || 0) + 1, S.actQuota || 1, actionName(k), Math.round(num(S.score, 0))), "sys");
      S.actCount = (S.actCount || 0) + 1;
      S.evCntWeek = {};
      S.evCountWeek = 0;
      renderHUD();
      runEventChain(() => afterAction(k));
    }

    /* ==================================================================
     * 运动锻炼的连锁事件
     * ------------------------------------------------------------------
     * 运动完之后，按配置概率从 SPORT_EVENTS 里抽 1~2 条运动类事件。
     * 抽不到就安静收尾 —— 运动本身已经给了身体上的收益。
     * ================================================================== */

    function runSportChain(done) {
      const cfg = (GAME_CONFIG && GAME_CONFIG.sport) || {};
      const chances = [num(cfg.chainChance && cfg.chainChance[0], 0.7), num(cfg.chainChance && cfg.chainChance[1], 0.35)];
      if (typeof pickSportEvent !== "function") {done(); return;}

      let i = 0;
      const step = () => {
        if (S.over || i >= chances.length) {done(); return;}
        if ((S.evWeekTotal || 0) >= GAME_CONFIG.maxEventsPerWeek) {done(); return;}
        if (Math.random() >= chances[i]) {done(); return;}
        const ev = pickSportEvent();
        if (!ev) {done(); return;}
        i++;
        S.evCntWeek[ev.id] = true;
        S.evCnt[ev.id] = (S.evCnt[ev.id] || 0) + 1;
        if (!S.evLastWeek) S.evLastWeek = {};
        S.evLastWeek[ev.id] = num(S.week, 0);
        S.evWeekTotal = (S.evWeekTotal || 0) + 1;
        S.evCountWeek = (S.evCountWeek || 0) + 1;
        renderHUD();
        showPopup(defOf(ev, "🏃 运动 · 连锁"), () => showEventResult(step));
      };
      step();
    }

    /* 周三社团课：保证出一个本社团的事件
     * 优先从本社团的事件里挑；实在没有（比如全都冷却中）就走普通事件链。 */
    function runClubEvent(done) {
      const mine = EVENTS.filter(e => e.id && e.id.indexOf("cl_") === 0
        && CLUB_MAP[S.club] && e.id.indexOf("cl_" + S.club) === 0
        && (!e.cond || e.cond(S)) && eventAllowed(e) && !S.evCntWeek[e.id]);
      let ev = null;
      if (mine.length) {
        const total = mine.reduce((a, e) => a + Math.max(0.1, eventWeight(e)), 0);
        let r = Math.random() * total;
        for (const e of mine) {r -= Math.max(0.1, eventWeight(e)); if (r <= 0) {ev = e; break;} }
        if (!ev) ev = mine[0];
      }
      if (!ev) {runEventChain(done); return;}
      S.evCntWeek[ev.id] = true;
      S.evCnt[ev.id] = (S.evCnt[ev.id] || 0) + 1;
      if (!S.evLastWeek) S.evLastWeek = {};
      S.evLastWeek[ev.id] = num(S.week, 0);
      S.evWeekTotal = (S.evWeekTotal || 0) + 1;
      S.evCountWeek = (S.evCountWeek || 0) + 1;
      renderHUD();
      showPopup(defOf(ev, "🎪 社团活动"), () => showEventResult(done));
    }

    /* 行动结束：先结算「破茧」进度，再决定是继续选行动还是结束本周 */

    function afterAction(k) {
      const cont = () => {
        if (S.over) return;
        if ((S.actCount || 0) < (S.actQuota || 1)) {
          advanceSlot();               // 周中做完 → 进入周末
          offerActions();
        } else afterWeek();
      };
      // 先消负面天赋（破茧），再检查有没有正面天赋因为久不练习而退化
      flushCure(() => {
        if (typeof flushDecay === "function") flushDecay(cont);
        else cont();
      });
    }

    /* 事件链：一次只弹一个；保底 1 个，之后按概率连锁，最多 maxChainEvents 个 */

    let resultBase = 0;

    function runEventChain(done) {
      let fired = 0;
      const step = () => {
        if (S.over) return done();
        if ((S.evWeekTotal || 0) >= GAME_CONFIG.maxEventsPerWeek) return done();
        const maxHere = Math.max(1, GAME_CONFIG.eventsPerAction) + Math.max(0, GAME_CONFIG.maxChainEvents);
        if (fired >= maxHere) return done();
        // 保底事件放完后，按概率决定是否连锁
        if (fired >= Math.max(1, GAME_CONFIG.eventsPerAction)) {
          const idx = fired - Math.max(1, GAME_CONFIG.eventsPerAction);
          const p = num(GAME_CONFIG.chainChance[idx], 0);
          if (Math.random() >= p) return done();
        }
        const def = buildEventDef();          // 现场挑选（能感知上一条事件带来的变化）
        if (!def) return done();              // 没有可用事件，直接收尾
        fired++;
        S.evCountWeek = (S.evCountWeek || 0) + 1;
        S.evWeekTotal = (S.evWeekTotal || 0) + 1;
        renderHUD();
        showPopup(def, () => showEventResult(step));
      };
      step();
    }

    /* 挑一个随机事件，包装成统一的弹窗定义 */

    /* ==================================================================
     * 单个事件的概率控制
     * ------------------------------------------------------------------
     * 写在事件定义里的可选字段（不写就用全局默认）：
     *   w: 5          基础权重，数字越大越常见
     *   once: true    一生只出现一次
     *   maxTimes: 3   最多出现 3 次，之后永不再出现
     *   decay: 0.5    每出现一次，权重乘以 0.5（0.5 = 减半）
     *   decayFloor: 0.1  衰减到原权重的 10% 就不再降了
     *   minTerm: 4    最早第几学期才出现（0=初一上，4=初三上）
     *   maxTerm: 5    最晚第几学期还会出现
     *
     * 例：
     *   {id: "x", w: 6, once: true,   ...}   // 很常见，但只出现一次
     *   {id: "y", w: 4, decay: 0.3,   ...}   // 出现一次后概率降到三成
     *   {id: "z", w: 5, maxTimes: 2,  ...}   // 最多出现两次
     * ================================================================== */

    /* 全局默认衰减（事件自己没写 decay 时用这个） */

    const EVENT_DECAY_STEP = 0.2;    // 每出现一次衰减 20%
    const EVENT_DECAY_MAX = 3;       // 最多衰减 3 次
    const EVENT_DECAY_FLOOR = 0.4;   // 最低不低于原权重的 40%

    /* 该事件此刻是否还能出现
     * ------------------------------------------------------------------
     * 依次检查：是否进池 → 次数/年级 → 时段 → 季节/月份 → 最小间隔
     * ================================================================== */

    function eventAllowed(e) {
      if (num(e.w, 1) <= 0) return false;              // w:0 = 不走随机池（由固定日程调用）
      const n = S.evCnt[e.id] || 0;
      if (e.once && n >= 1) return false;
      if (e.maxTimes != null && n >= e.maxTimes) return false;
      if (e.minTerm != null && clampNum(S.term, 0, 9) < e.minTerm) return false;
      if (e.maxTerm != null && clampNum(S.term, 0, 9) > e.maxTerm) return false;

      // 时段：周中住校的事不会跑到周末去，反之亦然
      // slot 可以写成单个 "weekday"，也可以写成数组 ["weekday","clubday"]
      const slot = e.slot || "any";
      if (slot !== "any" && S.slot) {
        const arr = Array.isArray(slot) ? slot : [slot];
        if (arr.indexOf(S.slot) < 0) return false;
      }

      // 季节 / 月份
      if (e.season || e.months) {
        const w = weekInfo(S.week, S.term);
        if (e.season) {
          const arr = Array.isArray(e.season) ? e.season : [e.season];
          if (arr.indexOf(w.season) < 0) return false;
        }
        if (e.months) {
          const arr = Array.isArray(e.months) ? e.months : [e.months];
          if (arr.indexOf(w.month) < 0) return false;
        }
      }

      // 最小间隔（让事件均匀地铺开，而不是扎堆）
      const gap = num(e.minGap, num(GAME_CONFIG.eventDist && GAME_CONFIG.eventDist.minGap, 0));
      if (gap > 0 && n > 0) {
        const last = (S.evLastWeek && S.evLastWeek[e.id] != null) ? num(S.evLastWeek[e.id], 0) : null;
        if (last != null && (num(S.week, 0) - last) < gap) return false;
      }
      return true;
    }

    /* 该事件此刻的有效权重
     * ------------------------------------------------------------------
     * dist 决定它「怎么分布在整个游戏里」：
     *   uniform 均匀 —— 距上次出现越久，权重越高（适合社团这类常驻事件）
     *   decay   衰减 —— 每出现一次权重 ×decay（适合一次性强的事件）
     *   front   前期多 —— 游戏前期概率高
     *   back    后期多 —— 游戏后期概率高
     * 另外：被「挂起」的事件（raiseEvent）权重会临时放大
     * ================================================================== */

    function eventWeight(e) {
      const n = S.evCnt[e.id] || 0;
      const w0 = num(e.w, 1);
      const cfg = GAME_CONFIG.eventDist || {};
      const mode = e.dist || cfg.mode || "decay";
      let w = w0;

      if (mode === "uniform") {
        const last = (S.evLastWeek && S.evLastWeek[e.id] != null) ? num(S.evLastWeek[e.id], 0) : null;
        if (last == null) w = w0 * 1.6;                       // 从没出现过 → 优先
        else {
          const gap = Math.max(0, num(S.week, 0) - last);
          const target = Math.max(2, num(e.minGap, 4));
          w = w0 * clampNum(gap / target, 0.15, 1.8);
        }
      } else if (mode === "decay") {
        const d = (e.decay != null) ? e.decay : num(cfg.decay, 0.5);
        const fl = (e.decayFloor != null) ? e.decayFloor : num(cfg.decayFloor, 0.15);
        w = w0 * Math.max(fl, Math.pow(clampNum(d, 0, 1, 0.5), n));
      } else if (mode === "front") {
        const prog = clampNum(S.week, 0, 150) / 150;
        w = w0 * clampNum(1.4 - prog * 1.2, 0.15, 1.4);
      } else if (mode === "back") {
        const prog = clampNum(S.week, 0, 150) / 150;
        w = w0 * clampNum(0.3 + prog * 1.3, 0.3, 1.6);
      }

      w *= pendingMult(e.id);      // 被挂起的后续事件，概率临时放大
      return Math.max(0, w);
    }

    /* 执行一个选项：基础效果 + 条件分支 + 后续安排 */

    function execOption(o) {
      resultBase = S.logs.length;
      runEffectSpec(o.run, S);

      // 条件分支：按顺序判断，命中第一个就执行并停止
      if (Array.isArray(o.branch) && o.branch.length) {
        for (const b of o.branch) {
          const ok = (typeof b.cond === "function") ? !!b.cond(S) : true;
          if (!ok) continue;
          runEffectSpec(b.run, S);
          if (b.say) say(b.say, b.cls || "");
          break;
        }
      }

      // 后续安排
      if (o.flag) setFlag(o.flag, true);
      if (Array.isArray(o.flags)) o.flags.forEach(f => setFlag(f, true));
      if (o.unflag) setFlag(o.unflag, false);
      if (o.raise) {
        const list = Array.isArray(o.raise) ? o.raise : [o.raise];
        list.forEach(r => {
          if (!r || !r.id) return;
          raiseEvent(r.id, r.weeks, r.mult, r.slot);
        });
      }
      if (o.next) {
        if (!Array.isArray(S.chainQueue)) S.chainQueue = [];
        S.chainQueue.push(o.next);       // 排在后面，等本条结束再弹
      }
      checkAch();
    }

    /* 标记（flag）：让"有没有带手机"这类状态能被后续事件读到 */

    function setFlag(k, v) {
      if (!S.flags) S.flags = {};
      S.flags[k] = !!v;
    }

    function hasFlag(k) {
      return !!(S.flags && S.flags[k]);
    }

    function buildEventDef() {
      if ((S.evWeekTotal || 0) >= GAME_CONFIG.maxEventsPerWeek) return null;

      // 优先弹「排队等着的后续事件」
      if (Array.isArray(S.chainQueue) && S.chainQueue.length) {
        const id = S.chainQueue.shift();
        const q = EVENTS.find(e => e.id === id);
        if (q && (!q.cond || q.cond(S)) && q.opts && q.opts.length) {
          S.evCntWeek[id] = true;
          S.evCnt[id] = (S.evCnt[id] || 0) + 1;
          if (!S.evLastWeek) S.evLastWeek = {};
          S.evLastWeek[id] = num(S.week, 0);
          return defOf(q, "⚡ 事件 · 后续");
        }
      }

      let pool = EVENTS.filter(e => !e.cond || e.cond(S));
      pool = pool.filter(e => eventAllowed(e));               // 时段/季节/次数/间隔
      pool = pool.filter(e => !S.evCntWeek[e.id]);            // 同一事件每周最多 1 次
      const fresh = pool.filter(e => (S.evCnt[e.id] || 0) < 2);
      if (fresh.length > 0) pool = fresh;                      // 优先没见过的
      if (!pool.length) return null;
      const effW = e => Math.max(0.1, eventWeight(e));
      const total = pool.reduce((s, e) => s + effW(e), 0);
      let r = Math.random() * total, ev = pool[0];
      for (const e of pool) {r -= effW(e); if (r <= 0) {ev = e; break;} }
      S.evCntWeek[ev.id] = true;
      S.evCountWeek++;
      S.evCnt[ev.id] = (S.evCnt[ev.id] || 0) + 1;
      if (!S.evLastWeek) S.evLastWeek = {};
      S.evLastWeek[ev.id] = num(S.week, 0);
      return defOf(ev, "");
    }

    /* 把一个事件定义包装成弹窗定义 */

    function defOf(ev, badge) {
      const slot = SLOT_MAP[S.slot] || SLOTS[0];
      /* 单亲 / 留守家庭：事件里爸爸妈妈的称呼要统一，不能一会妈一会爸。
       * 双亲家庭 famText 原样返回，不做任何改动。 */
      const F = (typeof famText === "function") ? famText : (x => x);
      const body = ev.c;
      return {
        kind: "event",
        title: F(ev.t),
        body: F(body),
        img: ev.img,
        badge: badge || "",
        slotNote: slot.icon + slot.name,
        options: ev.opts.filter(o => true).map(o => ({
          t: F(o.t), sub: F(o.sub || ""),
          disabled: !!(o.cond && !o.cond(S)),
          fn: () => {execOption(o);}
        }))
      };
    }

    /* 事件结果：同一个弹窗原地变成结果，玩家点「继续」才进下一个 */

    function showEventResult(next) {
      const logs = S.logs.slice(resultBase);
      if (GAME_CONFIG.eventResultMode === "log" || !logs.length) {next(); return;}
      const html = logs.map(l => `<div class="${l.cls || ""}" style="margin:2px 0">${l.txt}</div>`).join("");
      showPopup({
        kind: "event",
        badge: L("ev.resultBadge", clampNum(S.evWeekTotal, 0, 99), GAME_CONFIG.maxEventsPerWeek),
        title: L("ev.result"),
        body: `<div style="line-height:2.2">${html}</div>`,
        options: [{t: L("modal.continue")}]
      }, next);
    }

    /* ==================================================================
     * 「遗憾离场」：压力连续爆表若干周
     * ------------------------------------------------------------------
     * v1.1 起不再"压力一到 100 就崩"，而是给玩家三周的自救窗口：
     *   第 1 周 → 记一笔，日志里提醒
     *   第 2 周 → 黄牌警告（弹窗）
     *   第 3 周 → 遗憾离场
     * 中间任何一周把压力压回阈值以下，计数立刻清零。
     * ================================================================== */

    function burnCfg() {
      const b = (GAME_CONFIG && GAME_CONFIG.burnout) || {};
      return {at: num(b.stressAt, 100), weeks: Math.max(0, num(b.weeks, 3))};
    }

    function checkBurnout(done) {
      const c = burnCfg();
      if (c.weeks <= 0 || !S || S.over) {done(); return;}
      const hot = num(S.prop.压力, 0) >= c.at;

      if (!hot) {S.stressStreak = 0; done(); return;}

      S.stressStreak = num(S.stressStreak, 0) + 1;

      if (S.stressStreak >= c.weeks) {
        S.dead = "压力";
        say(L("burn.over"), "bad");
        gameOver();
        return;
      }

      // 还没到：给一次明确的警告（最后一次警告用弹窗，别让玩家莫名其妙就结束）
      const left = c.weeks - S.stressStreak;
      say(L("burn.warn", S.stressStreak, left), "bad");
      if (left <= 1) {
        showPopup({
          kind: "free",
          badge: L("burn.badge"),
          title: L("burn.warnTitle"),
          body: `<div style="line-height:2.2">${L("burn.warnBody", left)}</div>`,
          options: [{t: L("modal.continue")}]
        }, done);
      } else done();
    }

    /* ==================================================================
     * 亲情过低 → 家庭矛盾
     * ================================================================== */

    function checkFamilyConflict(done) {
      if (typeof shouldFamilyConflict !== "function" || typeof buildFamilyConflict !== "function") {done(); return;}
      if (!shouldFamilyConflict()) {done(); return;}
      say(L("fam.conflictLog"), "bad");
      showPopup(buildFamilyConflict(), done);
    }

    function afterWeek() {
      if (S.prop.健康 <= 0) {S.dead = "健康"; return gameOver();}
      if (S.prop.心态 <= 0) {S.dead = "心态"; return gameOver();}
      const brokeNeed = GAME_CONFIG.difficulty === "hard" ? 5 : (GAME_CONFIG.difficulty === "story" ? 12 : 8);
      if (S.prop.经济 <= 0 && S.term >= 2) {count("brokeWeek"); if (S.cnt.brokeWeek >= brokeNeed) {S.dead = "经济"; return gameOver();} }

      weeklySettle();
      if (S.prop.压力 >= 100) {modProp("心态", GAME_CONFIG.difficulty === "story" ? -7 : -15); say(L("flow.stressBurst", GAME_CONFIG.difficulty === "story" ? 7 : 15), "bad");}
      if (S.prop.健康 < 30) say(L("flow.healthWarn"), "bad");
      if (S.prop.心态 < 30) say(L("flow.mindWarn"), "bad");
      if (S.prop.压力 >= 80 && !Talent.have("不吃压力")) {modProp("效率", -3);}
      checkAch();

      if (S.prop.健康 <= 0) {S.dead = "健康"; return gameOver();}
      if (S.prop.心态 <= 0) {S.dead = "心态"; return gameOver();}

      renderHUD();

      // 压力连续爆表 → 遗憾离场（判定要在进下一周之前）
      checkBurnout(() => {
        if (S.over) return;
        // 亲情过低 → 家庭矛盾
        checkFamilyConflict(() => {
          if (S.over) return;
          if (!S.over) {nextWeek();}
        });
      });
    }

    function checkAch() {
      for (const [id, a] of Object.entries(ACHIEVEMENTS)) {
        if (S.ach.includes(id)) continue;
        if (a.c(S)) {
          S.ach.push(id);
          say(`🏆 达成成就【${a.n}】——${a.d}`, "ach");
          toast(`🏆 成就:${a.n}`, true);
          if (a.unlock) gainTalent(a.unlock, "成就奖励·免费");
        }
      }
    }

    function zhongkao() {
      count("zhongkao");
      const p = S.prop, subs = subjectsOf(S.term) || [];
      for (const k in PROP_RANGE) p[k] = fixProp(k, p[k]);
      ensureSubj();
      const diff = difficultyCurve(S.week, S.term);
      const W = examWeights();
      let total = 0;
      for (const sub of subs) {
        let v = examScoreOf(sub, p, diff, W);
        if (Talent.have("学神降世")) v += 8;
        if (Talent.have("学霸光环")) v += 5;
        if (Talent.have("考场黑马")) v += 3;
        if (Talent.have("考试焦虑")) v -= 8;
        total += clampNum(v, 0, 100, 0);
      }
      S.zhongkao = subs.length ? Math.round(clampNum(total / subs.length, 0, 100, 0)) : 0;
      S.lastExamScore = S.zhongkao;
      say(L("flow.zhongkao", S.zhongkao), "exam");
      checkAch();
      gameOver();
    }

    function gameOver() {
      S.over = true;
      const end = ENDINGS.find(e => e.c(S)) || ENDINGS[ENDINGS.length - 1];
      const sc = GAME_CONFIG.school;
      setBackground("end");            // 结局画面切到「立行号」列车背景
      if (typeof clearMood === "function") clearMood();   // 结局不该再被红雾盖住
      renderHUD();
      const talentList = Talent.owned.length ? Talent.owned.map(t => `${TZ(t)}(Lv.${TALENTS[t].lv})`).join("、") : L("end.none");
      const achList = S.ach.length ? S.ach.map(id => TZ(ACHIEVEMENTS[id].n)).join("、") : L("end.none");
      let reasonLine = "";
      if (S.zhongkao < 0) {
        if (S.dead === "健康") reasonLine = L("end.reasonHealth");
        else if (S.dead === "心态") reasonLine = L("end.reasonMind");
        else if (S.dead === "经济") reasonLine = L("end.reasonMoney");
        else if (S.dead === "压力") reasonLine = L("end.reasonStress");
      }
      showModal(L("end.title"),
        `<div class="endcard"><div class="big">${end.icon}</div><h2 style="color:var(--gold)">${TZ(end.n)}</h2><p style="margin-top:12px;line-height:2">${TZ(end.t)}</p>
     ${reasonLine ? `<p style="margin-top:8px;color:var(--red);font-weight:bold">${reasonLine}</p>` : ""}
     <p style="margin-top:14px;color:var(--dim);font-size:.9rem">「${sc.motto}」<br>
      <span style="font-size:.82rem">${L("end.arrival", sc.train)}</span></p>
     <p style="margin-top:16px;color:var(--dim)">${L("end.stat", S.week, S.zhongkao < 0 ? "—" : S.zhongkao, Talent.owned.length, S.ach.length, Object.keys(ACHIEVEMENTS).length)}</p>
     <div style="margin-top:14px;font-size:.85rem;color:var(--dim);text-align:left;line-height:1.9">
       <b style="color:var(--purple)">${L("end.talents")}:</b>${talentList}<br>
       <b style="color:#ffb86b">${L("end.ach")}:</b>${achList}
     </div></div>`,
        [{
          t: L("end.back"), fn: () => {setBackground("main"); toStart();}
        }, {t: L("end.restart"), fn: () => {setBackground("main"); newGameAt(slotCur);}}], null, true, false, {kind: "ending"});
    }

</script>
  <!-- 界面与弹窗 -->
  <script>
/* ==== 17-ui.js ==== */
/* ==================================================================
 * 界面层 · 渲染与弹窗
 * ==================================================================
 * 属性面板、天赋面板、行动面板、存档槽、统一弹窗系统。
 * 弹窗分四类：event 事件 / fixed 固定 / free 自由 / ending 结局。
 *
 * 维护等级：界面层（一般不动）
 * ============================================================ */

    function openTalentInfo(name) {
      const t = TALENTS[name];
      if (!t) return;
      const owned = Talent.have(name);
      const lvColor = t.lv >= 6 ? "var(--gold)" : (t.lv >= 4 ? "var(--purple)" : "var(--blue)");
      const incList = t.inc && t.inc.length
        ? t.inc.map(i => `${i} Lv.${TALENTS[i] ? TALENTS[i].lv : "?"}`).join(" · ")
        : "无";

      showModal(L("talent.detail"),
        `<div class="talent-header">
            <span class="talent-name" style="color:${lvColor}">${TZ(name)}</span>
            <span class="talent-lv" style="color:${lvColor}">Lv.${t.lv}</span>
         </div>
         <div class="talent-poem">「${TZ(t.poem) || "——"}」</div>
         <div class="talent-row">
            <div class="talent-section">
               <div class="label">${L("talent.effect")}</div>
               <div class="value">${TZ(t.desc)}</div>
            </div>
            <div class="talent-section">
               <div class="label">${L("talent.status")}</div>
               <div class="value">${owned
          ? `<span style='color:var(--green)'>${L("talent.owned")}</span>`
          : `${L("talent.locked")} · ${TZ(t.hint) || "—"}`}</div>
            </div>
         </div>
         <div class="talent-section inc">
            <div class="label">${L("talent.conflict")}</div>
            <div class="value">${incList}</div>
         </div>`,
        [{t: L("modal.close"), fn: () => { }}], null, false, true);
    }

    /* 天赋图鉴：每个天赋只占一行小卡片，诗句改用 title 悬停显示，
     * 这样 80 个天赋不用拉很长的滚动条。 */

    function openTalentBook() {
      const all = Object.entries(TALENTS);
      const got = all.filter(([n]) => Talent.have(n));
      const lock = all.filter(([n]) => !Talent.have(n));
      let h = `<div style="color:var(--dim);font-size:.8rem;margin-bottom:8px">
        ${L("talent.bookHint", got.length, all.length)}</div>`;
      h += "<div class='talentgrid'>";
      const row = ([name, t], owned) =>
        `<div class="talentitem ${owned ? "c" + t.lv : "lock"}" onclick="openTalentInfo('${name}')" title="${TZ(t.poem) || ""}">
          <b>${owned ? "🏆" : "🔒"} ${TZ(name)}</b><span class="tlv">Lv.${t.lv}</span>
          <div class="tdesc">${TZ(t.desc)}</div>
        </div>`;
      got.sort((a, b) => b[1].lv - a[1].lv).forEach(x => {h += row(x, true);});
      lock.sort((a, b) => a[1].lv - b[1].lv).forEach(x => {h += row(x, false);});
      h += "</div>";
      showModal(L("talent.book"), h, [{t: L("modal.close"), fn: () => { }}], null, false, true);
    }

    function openShop() {
      const opts = SHOP_ITEMS.map(it => ({
        t: TZ(it.n), sub: L("shop.price", it.price),
        disabled: () => S.prop.经济 < it.price,
        fn: () => {
          if (S.prop.经济 < it.price) {say(L("shop.poor"), "bad"); return;}
          modProp("经济", -it.price);
          S.items[it.id] = (S.items[it.id] || 0) + 1;
          say(L("shop.buy", TZ(it.n)), "good");
          toast(`${L("shop.title")}: ${TZ(it.n)}`);
          renderHUD();
          setTimeout(openShop, 100);
        }
      }));
      opts.push({t: L("shop.leave"), fn: () => {ensureActionPanel();}});
      showModal(L("shop.title"), `<div>${L("shop.body")}<br><span style="color:var(--dim);font-size:.85rem">${L("shop.money", Math.round(S.prop.经济))}</span></div>`, opts, null, false, true, {kind: "free"});
    }

    function useItem(id) {
      const it = SHOP_ITEMS.find(x => x.id === id);
      if (!it || !S.items[id] || S.items[id] <= 0) return;
      S.items[id]--;
      it.eff(S);
      say(L("item.used", TZ(it.n), TZ(it.desc)), "good");
      renderHUD();
      showModal(L("item.use"), `<div style="line-height:2">${L("item.effect", TZ(it.n))}<br>${TZ(it.desc)}</div>`, [{t: L("modal.ok"), fn: () => { }}], null, false, false, {kind: "free", img: it.img});
    }

    const STAT_COLOR = {心态: "#ffb4d1", 经济: "#d9b3ff", 健康: "#7ee0c0", 效率: "#b388ff", 悟性: "#c9a7ff", 社交: "#ffb86b", 压力: "#ff7aa2", 亲情: "#ffd08a"};

    /* ==================================================================
     * 属性面板
    /* ==================================================================
     * 属性面板
     * ------------------------------------------------------------------
     * v1.1 起只显示四项：心态 / 经济 / 健康 / 压力。
     *   经济 —— 显示具体数值（钱本来就该数得清）
     *   其余 —— 只显示「极低 / 较低 / 中 / 较高 / 极高」+ 五格刻度条
     * 效率 / 悟性 / 社交 / 亲情 仍在后台实时计算，但面板上一律不出现。
     * ================================================================== */

    function renderStatPanel() {
      const list = (typeof PROP_HUD !== "undefined") ? PROP_HUD : Object.keys(PROP_RANGE);
      let h = "<div class='statgrid'>";
      for (const k of list) {
        const v = fixProp(k, S.prop[k]); S.prop[k] = v;
        h += `<div class="stat compact">${statRowHtml(k, v)}</div>`;
      }
      h += "</div>";
      return h;
    }

    /* 单条属性：经济给数字，其余给档位 */
    function statRowHtml(k, v) {
      const name = propName(k);

      // 经济：唯一显示数字的一项
      if (k === "经济") {
        const pct = clampNum(v / 30, 0, 100, 2);
        return `<div class="stathead"><span>${name}</span><b class="num">${Math.round(v)}</b></div>
          <div class="bar"><i style="width:${pct}%;background:${STAT_COLOR[k] || "var(--gold)"}"></i></div>`;
      }

      // 其余：档位文字 + 五格刻度
      const lv = propLevel(v);
      const text = propLevelText(k, v);
      const tone = propPolarity(k) > 0 ? lv : (4 - lv);   // 压力反向配色
      let segs = "";
      for (let i = 0; i < 5; i++) {
        segs += `<i class="${i <= lv ? "on" : ""}"></i>`;
      }
      return `<div class="stathead"><span>${name}</span><b class="lv t${tone}">${text}</b></div>
        <div class="segbar t${tone}">${segs}</div>`;
    }

    function renderHUD() {
      if (!S) return;
      document.getElementById("hudGrade").textContent = `${S.name}(${genderName(S.gender)}) · ${gradeName()}`;
      document.getElementById("hudWeekText").textContent = L("hud.week", S.week);
      document.getElementById("hudTerm").textContent = termName();
      // 属性栏：只显示 PROP_HUD 的四项，且除经济外一律只给档位
      document.getElementById("statPanel").innerHTML = renderStatPanel();
      document.getElementById("talentCount").textContent = Talent.owned.length;
      document.getElementById("talentPanel").innerHTML = Talent.owned.length ?
        [...Talent.owned].sort((a, b) => TALENTS[b].lv - TALENTS[a].lv).map(t => `<span class="badge c${TALENTS[t].lv}" title="${TZ(TALENTS[t].desc)}" onclick="openTalentInfo('${t}')">${TZ(t)} Lv.${TALENTS[t].lv}${cureProgress(t)}</span>`).join("") : `<span style='color:var(--dim)'>${L("hud.noTalent")}</span>`;
      const itemCount = Object.values(S.items).reduce((a, b) => a + b, 0);
      document.getElementById("itemCount").textContent = itemCount;
      document.getElementById("itemPanel").innerHTML = itemCount > 0 ?
        Object.entries(S.items).filter(([k, v]) => v > 0).map(([k, v]) => {
          const it = SHOP_ITEMS.find(x => x.id === k);
          return it ? `<span class="badge" onclick="useItem('${k}')">${TZ(it.n)} ×${v}</span>` : "";
        }).join("") : `<span style='color:var(--dim)'>${L("hud.noItem")}</span>`;
      document.getElementById("lastExam").textContent = S.lastExamScore || "—";
      const r = S.zhongkao >= 0 ? S.zhongkao : (S.lastExamScore || 0);
      document.getElementById("rankNow").textContent = r ? L("hud.rankVal", Math.max(1, Math.round(clampNum(100 - r, 1, 100)))) : "—";
      // 静态标签（语言切换后要重刷）
      setText("talentLabel", L("hud.talent"));
      setText("talentHint", L("hud.talentHint"));
      setText("itemLabel", L("hud.item"));
      setText("scoreLabel", L("hud.score"));
      setText("lastExamLabel", L("hud.lastExam"));
      setText("rankLabel", L("hud.rank"));
      setText("actLabel", L("hud.act"));
      setText("evLabel", L("hud.ev"));
      setText("btnShop", L("hud.shop"));
      setText("btnTalentBook", L("hud.talentBook"));
      setText("btnAch", L("hud.ach"));
      setText("btnTheme", L("hud.theme"));
      setText("btnSave", L("hud.save"));
      setText("btnHome", L("hud.home"));
      setText("btnLang", L("hud.lang"));

      // 氛围特效：压力红雾 / 心态灰暗 / 健康发虚 / 经济见底
      if (typeof updateMood === "function") updateMood();
      if (typeof moodWhisper === "function") moodWhisper();

      // 本周行动进度
      const aq = num(S.actQuota, 0), ac = clampNum(S.actCount, 0, aq || 0);
      const ap = document.getElementById("actPill");
      if (ap) {
        ap.style.display = aq ? "" : "none";
        document.getElementById("actNow").textContent = ac;
        document.getElementById("actMax").textContent = aq;
      }

      // 本周事件进度
      const quota = Math.min(num(GAME_CONFIG.maxEventsPerWeek, 4), 8);
      const now = clampNum(S.evWeekTotal, 0, quota);
      const dots = document.getElementById("evDots");
      if (dots) dots.innerHTML = quota ? Array.from({length: quota}, (_, i) => `<span class="dot${i < now ? " on" : ""}"></span>`).join("") : "";
      const pill = document.getElementById("evPill");
      if (pill) pill.style.display = quota ? "" : "none";

      // 顶栏：时间（月份 + 季节 + 时段）与社团
      const tp = document.getElementById("hudTime");
      if (tp && typeof nowTimeText === "function") tp.textContent = nowTimeText();
      const cp = document.getElementById("clubPill");
      if (cp) {
        const cn = (typeof clubName === "function") ? clubName() : "";
        cp.classList.toggle("hidden", !cn);
        document.getElementById("hudClub").textContent = cn || "—";
      }

      // 弹窗处理中：暂时锁住自由面板，避免弹窗互相覆盖
      ["btnShop", "btnTalentBook", "btnAch"].forEach(id => {
        const el = document.getElementById(id);
        if (el) {el.disabled = popupBusy; el.classList.toggle("busy-lock", popupBusy);}
      });
      setTimeout(ensureActionPanel, 0);
    }

    function renderSlots() {
      const a = loadSaves(), box = document.getElementById("slotList"); box.innerHTML = "";
      a.forEach((d, i) => {
        const el = document.createElement("div"); el.className = "slot";
        if (d) {
          el.innerHTML = `<div class="info"><b>${L("save.slot", i + 1)} · ${d.name || L("save.anon")}(${genderName(d.gender)})</b> · ${L("grade." + (Math.min(2, Math.floor(d.term / 2)) + 1))} ${L("hud.week", d.week)}${d.over ? ` · <span style='color:var(--red)'>${L("save.over")}</span>` : ""}<br>${L("save.info", d.zhongkao < 0 ? "—" : d.zhongkao, d.ach.length, d.time)}</div>
      <div><button class="btn green" onclick="resumeGame(${i})">${L("save.resume")}</button><button class="btn" onclick="if(confirm('${L("save.confirmOver")}'))newGameAt(${i})">${L("save.restart")}</button><button class="btn" onclick="delSave(${i})">${L("save.delete")}</button></div>`;
        } else {
          el.innerHTML = `<div class="info"><b>${L("save.slot", i + 1)}</b> · ${L("save.empty")}</div><div><button class="btn primary" onclick="newGameAt(${i})">${L("save.new")}</button></div>`;
        }
        box.appendChild(el);
      });
    }

    function delSave(i) {if (!confirm(L("save.confirmDel"))) return; const a = loadSaves(); a[i] = null; writeSaves(a); renderSlots();}

    /* ------------------------------------------------------------------
     * 统一弹窗层：一切「需要玩家点击选择」的界面都是弹窗，弹窗就是事件
     *   kind 说明：
     *     event  随机事件 —— 消耗本周行动额度
     *     fixed  固定事件 —— 开学/考试/运动会/假期副本
     *     free   自由操作 —— 小卖铺/道具/读书角/图鉴/成就，不消耗任何额度
     *     ending 结局
     * 同一时刻只会有一个弹窗，处理完才排下一个（避免弹窗互相覆盖）
     * ------------------------------------------------------------------ */

    let popupBusy = false;

    function badgeText(kind) {
      if (!S) return "";
      if (kind === "event") return L("badge.event", clampNum(S.evWeekTotal, 0, 99), GAME_CONFIG.maxEventsPerWeek);
      if (kind === "fixed") return L("badge.fixed");
      if (kind === "free") return L("badge.free");
      if (kind === "ending") return L("badge.ending");
      return "";
    }

    function hideModalRaw() {document.getElementById("modalMask").classList.add("hidden")}

    function showModal(title, body, opts, onClose, lock, showClose, meta) {
      const m = document.getElementById("modalMask");
      const modalEl = document.getElementById("modalBox") || m.querySelector(".modal");
      const kind = (meta && meta.kind) || "free";
      popupBusy = true;
      m.classList.remove("hidden");
      modalEl.classList.remove("k-event", "k-fixed", "k-ending", "k-free");
      modalEl.classList.add("k-" + kind);
      if (title === L("talent.detail")) modalEl.classList.add("talent-modal");
      else modalEl.classList.remove("talent-modal");
      document.getElementById("modalTitle").textContent = title === L("talent.detail") ? "" : title;

      const badge = document.getElementById("modalBadge");
      const bt = (meta && meta.badge) || badgeText(kind);
      if (bt) {badge.textContent = bt; badge.className = "pop-badge k-" + kind; badge.style.display = "";}
      else badge.style.display = "none";

      const media = document.getElementById("modalMedia");
      if (media) {
        if (meta && meta.img) {
          media.innerHTML = `<img src="${meta.img}" alt="" onerror="this.parentNode.style.display='none'">`;
          media.style.display = "";
        } else {media.innerHTML = ""; media.style.display = "none";}
      }

      const closeX = document.getElementById("modalCloseX");
      if (showClose) closeX.style.display = ""; else closeX.style.display = "none";
      closeX.onclick = () => closeModal(onClose);

      const b = document.getElementById("modalBody");
      if (typeof body === "string" && body.includes("<")) b.innerHTML = body; else b.textContent = body;
      const ob = document.getElementById("modalOpts"); ob.innerHTML = "";
      const list = opts || [{t: L("modal.continue"), fn: () => { }}];
      let anyEnabled = false;
      list.forEach(o => {
        const btn = document.createElement("button"); btn.className = "btn primary optbtn";
        btn.innerHTML = o.sub ? `<b>${o.t}</b><br><small>${o.sub}</small>` : o.t;
        const dis = typeof o.disabled === "function" ? o.disabled(S) : o.disabled;
        if (dis) btn.disabled = true; else anyEnabled = true;
        btn.onclick = () => {
          popupBusy = false;              // 先释放当前弹窗
          o.fn && o.fn(S);                // 若它内部又开了新弹窗，popupBusy 会重新变 true
          if (!popupBusy) {               // 没有新弹窗 → 收尾并交还控制权
            hideModalRaw();
            setTimeout(ensureActionPanel, 0);
            onClose && onClose();
          }
          renderHUD();
        };
        ob.appendChild(btn);
      });
      if (!anyEnabled) {
        const btn = document.createElement("button"); btn.className = "btn primary optbtn";
        btn.textContent = L("modal.continue");
        btn.onclick = () => closeModal(onClose);
        ob.appendChild(btn);
      }
      m._lock = lock;

      // 内容区滚动提示：没滚到底就在底部加一道渐隐
      setupScrollFade(document.getElementById("modalBody"));
    }

    /* 滚动提示：给可滚动的内容区挂上/摘掉渐隐
     * 滚动条被隐藏之后，玩家需要知道"下面还有内容"。 */
    function setupScrollFade(el) {
      if (!el) return;
      const update = () => {
        const room = el.scrollHeight - el.clientHeight;
        const atEnd = el.scrollTop + el.clientHeight >= el.scrollHeight - 4;
        el.classList.toggle("fade", room > 4 && !atEnd);
        el.classList.toggle("at-end", room <= 4 || atEnd);
      };
      el.onscroll = update;
      // 内容刚塞进去时尺寸还没算出来，下一帧再量一次
      update();
      setTimeout(update, 0);
      setTimeout(update, 120);
    }

    function closeModal(onClose) {
      hideModalRaw();
      popupBusy = false;
      setTimeout(ensureActionPanel, 0);
      renderHUD();
      onClose && onClose();
    }

    /* 语义化入口：def = {kind, title, body, img, options:[{t,sub,disabled,fn}], showClose, lock} */

    function showPopup(def, onResolve) {
      showModal(def.title, def.body, def.options, () => onResolve && onResolve(),
        def.lock, def.showClose, {kind: def.kind || "free", img: def.img, badge: def.badge});
    }

    /* ==================================================================
     * 做题（本周行动）
     * ------------------------------------------------------------------
     * 消耗一次行动，出一道「当前年级 + 当前科目」范围内的题。
     * 答对：该科学力加成（随年级放大），心态小涨
     * 答错：该科小幅倒扣，压力小涨 —— 做错题也是有代价的
     * 题库见 js/05d-data-quiz.js 的 QUIZ_BANK。
     * ================================================================== */

    function openQuiz(done) {
      const q = (typeof pickQuiz === "function") ? pickQuiz() : null;

      // 该年级暂无题目：退化成一次普通学习，不浪费玩家的行动
      if (!q) {
        say(L("quiz.none"), "sys");
        studySettle("quiz");
        S.actCount = (S.actCount || 0) + 1;
        S.didQuizWeek = num(S.week, 0);
        count("quiz");
        renderHUD();
        if (typeof done === "function") done();
        return;
      }

      const grad = clamp(Math.floor(clampNum(S.term, 0, 9, 0) / 2), 0, 2);
      const bonus = Math.round(14 + grad * 8);              // 答对：初一 14 → 初三 30
      const penalty = -Math.max(4, Math.round(bonus * 0.35)); // 答错：扣三成半

      const finish = (ok) => {
        if (ok) {
          S.subj[q.sub] = clamp(num(S.subj[q.sub], 30) + bonus, 0, SUBJ_CAP);
          modProp("心态", 3);
          if (Math.random() < 0.35) modProp("悟性", 1);
          say(L("quiz.right", TZ(q.sub), bonus), "good");
          floatGain(L("quiz.rightFloat", TZ(q.sub)), true);
        } else {
          S.subj[q.sub] = clamp(num(S.subj[q.sub], 30) + penalty, 0, SUBJ_CAP);
          modProp("心态", -2); modProp("压力", 2);
          say(L("quiz.wrong", TZ(q.sub), Math.abs(penalty)), "bad");
          floatGain(L("quiz.wrongFloat", TZ(q.sub)), false);
        }
        recalcScore();
        S.actCount = (S.actCount || 0) + 1;
        S.didQuizWeek = num(S.week, 0);
        S.didStudyWeek = num(S.week, 0);     // 做题也算"碰过学习"，避免天赋退化
        count("quiz");
        renderHUD();
      };

      const meta = {kind: "free", badge: L("quiz.badge")};
      const whyLine = q.why ? `<div style="margin-top:10px;color:var(--dim);font-size:.85rem">${L("quiz.why")} ${q.why}</div>` : "";

      if (q.type === "choice") {
        const opts = q.opts.map((o, i) => ({
          t: o,
          fn: () => {
            const ok = (i === q.ansIndex);
            finish(ok);
            showModal(L("quiz.resultTitle"), `<div style="line-height:2">
              <div>${q.q}</div>
              <div style="margin-top:8px;color:${ok ? "var(--green)" : "var(--red)"}">${ok ? L("quiz.correct") : L("quiz.incorrect")}</div>
              <div style="margin-top:4px">${L("quiz.answer")} <b>${q.opts[q.ansIndex]}</b></div>
              ${whyLine}</div>`, [{t: L("modal.continue")}], () => {if (done) done();}, false, false, meta);
          }
        }));
        showModal(L("quiz.title", TZ(q.sub)), `<div style="line-height:2">${q.q}</div>
          <div style="margin-top:6px;color:var(--dim);font-size:.82rem">${L("quiz.tip")}</div>`,
          opts, null, false, false, meta);
        return;
      }

      // 填空题：手写一个答案
      const bodyHtml = `<div style="line-height:2">${q.q}</div>
        <div style="margin-top:10px"><input id="quizInput" type="text" autocomplete="off"
          placeholder="${L("quiz.placeholder")}"
          style="width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-size:.95rem"></div>
        <div style="margin-top:6px;color:var(--dim);font-size:.82rem">${L("quiz.fillTip")}</div>`;

      showModal(L("quiz.title", TZ(q.sub)), bodyHtml, [{
        t: L("quiz.submit"),
        fn: () => {
          const el = document.getElementById("quizInput");
          const val = el ? el.value : "";
          const ok = (typeof quizMatch === "function") ? quizMatch(val, q.ans) : false;
          finish(ok);
          showModal(L("quiz.resultTitle"), `<div style="line-height:2">
            <div>${q.q}</div>
            <div style="margin-top:8px;color:${ok ? "var(--green)" : "var(--red)"}">${ok ? L("quiz.correct") : L("quiz.incorrect")}</div>
            <div style="margin-top:4px">${L("quiz.answer")} <b>${q.ans}</b>${val ? `（${L("quiz.yours")} ${val}）` : ""}</div>
            ${whyLine}</div>`, [{t: L("modal.continue")}], () => {if (done) done();}, false, false, meta);
        }
      }, {
        t: L("quiz.giveup"),
        fn: () => {
          say(L("quiz.giveupLog", TZ(q.sub)), "sys");
          finish(false);
          showModal(L("quiz.resultTitle"), `<div style="line-height:2">
            <div>${q.q}</div>
            <div style="margin-top:8px;color:var(--dim)">${L("quiz.gaveup")}</div>
            <div style="margin-top:4px">${L("quiz.answer")} <b>${q.ans}</b></div>
            ${whyLine}</div>`, [{t: L("modal.continue")}], () => {if (done) done();}, false, false, meta);
        }
      }], null, false, false, meta);

      // 回车即提交：输入框里按 Enter 等同于点「交卷」
      setTimeout(() => {
        const el = document.getElementById("quizInput");
        if (!el) return;
        el.focus();
        el.onkeydown = (e) => {
          if (e.key !== "Enter") return;
          e.preventDefault();
          const btn = document.querySelector("#modalOpts button");
          if (btn && !btn.disabled) btn.click();
        };
      }, 60);
    }

    function toast(t, isAch) {
      const d = document.createElement("div");
      d.className = "toast" + (isAch ? " ach-toast" : "");
      d.textContent = t;
      document.getElementById("toastBox").appendChild(d);
      setTimeout(() => d.remove(), 2600);
    }

    function openAch() {
      let h = "<div class='achlist'>";
      for (const [id, a] of Object.entries(ACHIEVEMENTS)) {
        const got = S && S.ach.includes(id);
        h += `<div class="achitem ${got ? "" : "lock"}"><b>${got ? "🏆" : "🔒"} ${TZ(a.n)}</b><br><span style="color:var(--dim)">${TZ(a.d)}</span></div>`;
      }
      showModal(L("ach.title"), h + "</div>", [{t: L("modal.close"), fn: () => { }}], null, false, true, {kind: "free"});
    }

    function toStart() {
      saveGame(false);
      if (typeof setBackground === "function") setBackground("main");
      if (typeof clearMood === "function") clearMood();   // 主菜单不该带着红雾
      document.getElementById("gameScreen").classList.add("hidden");
      document.getElementById("startScreen").classList.remove("hidden");
      renderSlots();
      if (typeof renderStartExtras === "function") renderStartExtras();
    }

</script>
  <!-- 本地存档 -->
  <script>
/* ==== 18-save.js ==== */
/* ==================================================================
 * 存档层 · 本地存档
 * ==================================================================
 * 三个存档槽的读写、读档时的数据净化与字段补全。
 *
 * 维护等级：存档层（一般不动）
 * ============================================================ */

    const SAVE_KEY = "zhongkao_life_saves_v6";

    function loadSaves() {try {return JSON.parse(localStorage.getItem(SAVE_KEY)) || [null, null, null]} catch (e) {return [null, null, null]} }

    function writeSaves(a) {localStorage.setItem(SAVE_KEY, JSON.stringify(a))}

    function saveGame(manual) {
      if (!S) return;
      const a = loadSaves();
      a[slotCur] = {
        week: S.week, term: S.term, name: S.name, gender: S.gender,
        evCnt: S.evCnt, daoDone: S.daoDone, subj: S.subj, prop: S.prop,
        score: S.score, lastExamScore: S.lastExamScore, bestExam: S.bestExam, zhongkao: S.zhongkao,
        buff: [S.studyBuff, S.buffWeeks, S.studyDebuff, S.debuffWeeks],
        cnt: S.cnt, ach: S.ach, over: S.over, dead: S.dead,
        talents: Talent.owned, items: S.items,
        evCntWeek: S.evCntWeek, evCountWeek: S.evCountWeek, evWeekTotal: S.evWeekTotal,
        actQuota: S.actQuota, actCount: S.actCount, cure: S.cure,
        // —— 时间系统 ——（不存的话读档会退回周中）
        slot: S.slot, slotPlan: S.slotPlan, slotIdx: S.slotIdx,
        // —— 社团 ——（不存的话读档社团会凭空消失）
        club: S.club, clubCount: S.clubCount, clubTried: S.clubTried,
        clubSkip: S.clubSkip, clubTerm: S.clubTerm, clubSkipTerm: S.clubSkipTerm,
        // —— 事件调度 ——（手机标记、挂起事件、事件冷却都在这里）
        flags: S.flags, pending: S.pending, evLastWeek: S.evLastWeek, chainQueue: S.chainQueue,
        time: new Date().toLocaleString()
      };
      writeSaves(a);
      if (manual) {toast(L("save.saved")); renderSlots();}
    }

    function resumeGame(i) {
      const d = loadSaves()[i]; if (!d) return;
      slotCur = i; Talent.owned = d.talents || []; Talent.solve();
      const bf = Array.isArray(d.buff) ? d.buff : [0, 0, 0, 0];
      S = {week: d.week, term: d.term, name: d.name || "无名氏", gender: d.gender || "男", evCnt: d.evCnt || {}, daoDone: d.daoDone, subj: sanitizeSubj(d.subj), prop: sanitizeProp(d.prop), score: d.score, lastExamScore: d.lastExamScore, bestExam: d.bestExam, zhongkao: d.zhongkao, studyBuff: bf[0], buffWeeks: bf[1], studyDebuff: bf[2], debuffWeeks: bf[3], cnt: d.cnt, ach: d.ach, over: d.over, dead: d.dead, logs: [], items: d.items || {}, evCntWeek: d.evCntWeek || {}, evCountWeek: d.evCountWeek || 0, evWeekTotal: d.evWeekTotal || 0, actQuota: d.actQuota || 0, actCount: d.actCount || 0, cure: d.cure || {},
        slot: d.slot || "weekday", slotPlan: Array.isArray(d.slotPlan) ? d.slotPlan : ["weekday", "weekend"], slotIdx: clampNum(d.slotIdx, 0, 9),
        club: d.club || "", clubCount: num(d.clubCount, 0), clubTried: Array.isArray(d.clubTried) ? d.clubTried : [], clubSkip: !!d.clubSkip, clubTerm: num(d.clubTerm, -1), clubSkipTerm: num(d.clubSkipTerm, -1),
        flags: d.flags || {}, pending: Array.isArray(d.pending) ? d.pending : [], evLastWeek: d.evLastWeek || {}, chainQueue: Array.isArray(d.chainQueue) ? d.chainQueue : []};
      S.week = clampNum(S.week, 0, 999); S.term = clampNum(S.term, 0, TERMS);
      S.score = num(S.score, 0); S.lastExamScore = clampNum(S.lastExamScore, 0, 100);
      S.bestExam = clampNum(S.bestExam, 0, 100); S.zhongkao = num(S.zhongkao, -1);
      ensureSubj(); recalcScore();
      if (typeof setBackground === "function") setBackground(S.over && S.week > 0 ? "end" : "main");
      document.getElementById("startScreen").classList.add("hidden");
      document.getElementById("gameScreen").classList.remove("hidden");
      document.getElementById("log").innerHTML = "";
      say(L("save.loaded"), "sys");
      if (S.over) {gameOver();} else startWeek();
    }

    function newGameAt(i) {
      slotCur = i;
      const m = document.getElementById("modalMask"); m.classList.remove("hidden"); m._lock = true;
      popupBusy = true;
      const _bd = document.getElementById("modalBadge"); if (_bd) _bd.style.display = "none";
      const _md = document.getElementById("modalMedia"); if (_md) {_md.innerHTML = ""; _md.style.display = "none";}
      document.getElementById("modalTitle").textContent = L("cc.title");
      document.getElementById("modalBody").innerHTML =
        `<div style="line-height:2.4">
       ${L("cc.name")}:<input id="inpName" maxlength="8" placeholder="${L("cc.namePh")}" style="background:#0b0818;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 12px;width:60%"><br>
       ${L("cc.gender")}:<label><input type="radio" name="inpGender" value="男" checked> ${L("cc.male")}</label>
            <label style="margin-left:16px"><input type="radio" name="inpGender" value="女"> ${L("cc.female")}</label>
     </div>
     <div style="color:var(--dim);font-size:.85rem;margin-top:8px">${L("cc.pick")}</div>
     <div class="namegrid" id="nameGrid"></div>`;
      const ob = document.getElementById("modalOpts"); ob.innerHTML = "";
      const btn = document.createElement("button"); btn.className = "btn primary"; btn.textContent = L("cc.start");
      btn.onclick = () => {
        const nm = (document.getElementById("inpName").value || "").trim() || L("save.anon");
        const gd = document.querySelector("input[name=inpGender]:checked").value;
        closeModal();
        newGame(nm, gd);
        if (typeof setBackground === "function") setBackground("main");
        document.getElementById("startScreen").classList.add("hidden");
        document.getElementById("gameScreen").classList.remove("hidden");
        document.getElementById("log").innerHTML = "";
        say(L("cc.begin", nm), "sys");
        startWeek();
      };
      ob.appendChild(btn);
      setTimeout(() => {
        const grid = document.getElementById("nameGrid");
        if (!grid) return;
        const maleNames = LANG === "en"
          ? ["Ethan", "Noah", "Liam", "Lucas", "Mason", "Owen", "Caleb", "Ryan", "Adrian", "Felix", "Julian", "Milo", "Theo", "Ivan", "Oscar", "Leon"]
          : ["李承宇", "王浩然", "张子墨", "刘俊熙", "陈宇航", "杨启航", "赵泽楷", "周天佑", "顾北辰", "沈亦白", "陆时安", "程星野", "谢知遥", "韩煜城", "顾言澈", "林书珩"];
        const femaleNames = LANG === "en"
          ? ["Emma", "Ava", "Sophia", "Chloe", "Luna", "Mia", "Nora", "Iris", "Elena", "Clara", "Hazel", "Ruby", "Vera", "Stella", "Freya", "Lydia"]
          : ["林诗涵", "苏婉清", "沈梦瑶", "顾念之", "叶清欢", "陆雨萱", "唐若曦", "许安然", "江晚吟", "沈知意", "顾星晚", "温以宁", "白书予", "叶挽晴", "林疏桐", "苏可盈"];
        const getG = () => document.querySelector("input[name=inpGender]:checked").value;
        const renderNames = () => {
          const pool = getG() === "男" ? maleNames : femaleNames;
          grid.innerHTML = "";
          pool.forEach(n => {
            const b = document.createElement("button");
            b.className = "namebtn"; b.textContent = n;
            b.onclick = () => {document.getElementById("inpName").value = n;};
            grid.appendChild(b);
          });
        };
        renderNames();
        document.querySelectorAll("input[name=inpGender]").forEach(r => r.onchange = renderNames);
      }, 0);
    }

</script>
  <!-- 启动入口 -->
  <script>
/* ==== 19-boot.js ==== */
/* ==================================================================
 * 启动入口
 * ------------------------------------------------------------------
 * 所有文件加载完毕后，由这里点火：
 *   读本地设置（主题 + 语言）→ 应用主题 → 刷文案 → 渲染存档槽。
 * 这是最后一个加载的 js 文件。
 * ================================================================== */

    (function boot() {
      // 1. 先读设置：主题与语言会立刻写到 :root 上
      if (typeof loadSettings === "function") loadSettings();

      // 2. 应用主题皮肤（校名、校训、滚动条开关也在里面）
      applyTheme();

      // 3. 把界面文案刷成当前语言
      if (typeof applyLangToDom === "function") applyLangToDom();
      if (typeof refreshDocTitle === "function") refreshDocTitle();

      // 4. 主菜单：存档槽 + 主题格子 + 说明文案
      renderSlots();
      if (typeof renderStartExtras === "function") renderStartExtras();
    })();

</script>
</body>
