<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中考人生模拟器 · 玉溪市红塔中学</title>

  <!-- ============================================================
       样式：按层拆分，改外观只动这里
       ============================================================ -->
  <style>
/* ============================================================
 * 基础层：配色变量、全局重置、背景、标题
 * ------------------------------------------------------------
 * 这一层只负责"长什么样"，不涉及任何玩法逻辑。
 * 想换配色、字号、动画，改这里即可。
 * ============================================================ */

    /* 主题色：清华紫 #660874
     * ------------------------------------------------------------
     * 品牌色本身很深，直接当文字色会看不清，所以拆成两支：
     *   --brand  清华紫本体，用于按钮底、渐变、卡片背景
     *   --purple 提亮后的紫，用于标题/边框/图标等需要看清的地方
     * 想换配色只改这一段，全局生效。
     */
    :root {
      --brand: #660874;       /* 清华紫（品牌主色） */
      --brand-deep: #3d0647;
      --brand-lite: #8a2b9c;

      --purple: #c08ae8;      /* 提亮紫 · 标题/边框/强调文字 */
      --purple2: #9c4dcc;
      --gold: #d7b45a;        /* 点缀金（徽章/进度条） */
      --gold-soft: #f0d488;   /* 亮金（标题发光） */

      --bg: #120a18;
      --panel: #1e1029;
      --panel2: #2a1638;
      --line: #4a2760;
      --txt: #f2ecf7;
      --dim: #bda9cd;
      --green: #7ee0c0;
      --red: #ff7aa2;
      --blue: #a86ddb;

      /* 发光色的 rgb 三元组：写成 rgb 才能在 rgba() 里调透明度。
         这三组由 js/02c-themes.js 按主题覆盖，不要在这里改。 */
      --glow: 156, 77, 204;
      --glow2: 192, 138, 232;
      --brand-rgb: 102, 8, 116;

      /* 没有背景图时用的纯 CSS 渐变（主题自带） */
      --bg-grad: none;
      --bg-image: none;
      --bg-opacity: 0.26;
      --bg-overlay: rgba(18, 10, 24, .82);
    }

    /* ============================================================
     * 屏幕自适应：根字号随视口宽度线性变化
     * ------------------------------------------------------------
     * 全站尺寸都用 rem，所以只改这一个数，按钮 / 卡片 / 间距
     * 会整整齐齐地一起放大缩小 —— 不会出现"大屏上字小得像蚂蚁"
     * 或"小笔记本上按钮顶出屏幕"的情况。
     *   1024 宽 → 约 14.3px　1280 宽 → 约 15.1px　1920 宽 → 约 17px
     * 想整体更大/更小，调下面这行即可。
     * ============================================================ */
    html {
      font-size: clamp(13px, calc(11px + 0.36vw), 18px)
    }

    /* 矮屏（1366×768 这类笔记本）：字号再收一档，换垂直空间 */
    @media(max-height:820px) {
      html {
        font-size: clamp(12.5px, calc(10.5px + 0.26vw), 15px)
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      /* 主题渐变 + 兜底深色，两者叠着用，主题没配渐变也不会白屏 */
      background: var(--bg-grad, none), var(--bg);
      background-color: var(--bg);
      color: var(--txt);
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: .92rem;
      min-height: 100vh;
      padding: clamp(8px, 0.9vh, 14px)
    }

    /* 内容宽度：小屏跟着缩，大屏最多铺到 1280px 而不是一条 960 的窄带 */
    .screen {
      width: min(1280px, 96vw);
      margin: 0 auto
    }

    /* ============================================================
     * 游戏屏：整屏自适应，一屏装下所有东西
     * ------------------------------------------------------------
     * 用 flex 撑满视口高度，日志区吃掉剩余空间（flex:1），
     * 行动面板保持自身高度。这样 768 高的笔记本和 1440 高的
     * 大屏看到的都是"不用滚的完整界面"，只是日志区高矮不同。
     * ============================================================ */
    #gameScreen {
      height: calc(100vh - 2 * clamp(8px, 0.9vh, 14px));
      height: calc(100dvh - 2 * clamp(8px, 0.9vh, 14px));
      display: flex;
      flex-direction: column;
      min-height: 0
    }

    /* 窄屏 / 矮屏：放弃"一屏装下"，回到自然滚动（不然内容会被压扁） */
    @media(max-width:760px),
    (max-height:560px) {
      #gameScreen {
        height: auto;
        min-height: calc(100vh - 2 * clamp(8px, 0.9vh, 14px))
      }
    }

    h1 {
      font-size: 2rem;
      letter-spacing: 4px;
      text-align: center;
      color: var(--gold-soft);
      text-shadow: 0 0 24px rgba(215, 180, 90, .45);
      animation: titleGlow 3s ease-in-out infinite alternate
    }

    @keyframes titleGlow {
      from {
        text-shadow: 0 0 24px rgba(215, 180, 90, .45)
      }

      to {
        text-shadow: 0 0 40px rgba(240, 212, 136, .85)
      }
    }

    .sub {
      text-align: center;
      color: var(--dim);
      margin: 6px 0 14px
    }

</style>
  <style>
/* ============================================================
 * 组件层：按钮、卡片、属性条、徽章、日志、行动面板
 * ------------------------------------------------------------
 * 这一层只负责"长什么样"，不涉及任何玩法逻辑。
 * 想换配色、字号、动画，改这里即可。
 * ============================================================ */

    .btn {
      display: inline-block;
      background: linear-gradient(135deg, var(--brand-lite), var(--brand-deep));
      border: 1px solid var(--line);
      color: var(--txt);
      padding: 8px 16px;
      border-radius: 9px;
      font-size: .92rem;
      cursor: pointer;
      transition: box-shadow .2s ease, border-color .2s ease, filter .2s ease, background .2s ease;
      margin: 4px;
      position: relative;
      overflow: hidden
    }

    .btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(var(--glow2), .2), transparent);
      transition: left .4s ease
    }

    .btn:not(:disabled):hover::before {
      left: 100%
    }

    .btn::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      box-shadow: 0 0 0 0 rgba(var(--glow), 0);
      transition: box-shadow .22s ease
    }

    .btn:not(:disabled):hover::after {
      box-shadow: 0 0 0 2px rgba(var(--glow), .5), 0 8px 22px rgba(var(--glow), .32)
    }

    .btn:not(:disabled):hover {
      filter: brightness(1.14);
      border-color: var(--purple)
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--brand-lite), var(--brand));
      border: none;
      font-weight: bold
    }

    .btn.green {
      background: linear-gradient(135deg, #7ee0c0, #3aa88a);
      border: none
    }

    .btn:disabled {
      opacity: .4;
      cursor: not-allowed;
      filter: none
    }

    .btn:disabled::after {
      display: none
    }

    .btn:disabled:hover {
      filter: none;
      border-color: var(--line);
      box-shadow: none
    }

    .btn:disabled.green {
      filter: grayscale(.7)
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 11px 13px;
      margin: 0;
      animation: fadeInUp .4s ease both
    }

    /* 开始界面（主菜单）是单列长页面，卡片之间需要留白 */
    #startScreen .card {
      margin: 10px 0
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(12px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .slots {
      display: grid;
      gap: 14px
    }

    .slot {
      background: var(--panel2);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      transition: all .2s ease
    }

    .slot:hover {
      border-color: var(--purple);
      box-shadow: 0 4px 16px rgba(var(--glow), .2)
    }

    .slot .info {
      font-size: .9rem;
      color: var(--dim);
      line-height: 1.7
    }

    .slot .info b {
      color: var(--txt);
      font-size: 1.05rem
    }

    .hidden {
      display: none !important
    }

    /* 主区：左栏宽度随视口变化（小屏 210 / 大屏 280），
     * 并用 min-height:0 允许内部滚动 —— 否则 flex 子项会被内容撑破。 */
    #hud {
      display: grid;
      grid-template-columns: clamp(210px, 21vw, 280px) 1fr;
      gap: 10px;
      align-items: stretch;
      flex: 1 1 auto;
      min-height: 0
    }

    /* 左栏：状态卡片竖排，间距统一收紧；内容超高时自己滚 */
    .sidecol {
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 8px;
      min-height: 0;
      overflow-y: auto
    }

    /* 右栏：日志吃掉剩余高度，行动面板保持自身高度 */
    .maincol {
      display: grid;
      grid-template-rows: 1fr auto;
      gap: 8px;
      min-height: 0
    }

    @media(max-width:760px) {
      #hud {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr
      }

      .sidecol {
        grid-template-rows: none;
        overflow: visible
      }
    }

    .stat {
      margin: 6px 0;
      font-size: .9rem
    }

    .stat .bar {
      height: 8px;
      background: #11152e;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 3px
    }

    .stat .bar i {
      display: block;
      height: 100%;
      border-radius: 4px;
      transition: width .6s cubic-bezier(.4, 0, .2, 1)
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: .78rem;
      margin: 2px;
      border: 1px solid var(--line);
      transition: all .2s ease;
      cursor: pointer
    }

    .badge:hover {
      box-shadow: 0 0 12px rgba(var(--glow), .5);
      border-color: var(--purple);
      filter: brightness(1.2)
    }

    .c1 {
      color: #a99fd4
    }

    .c2 {
      color: #7ee0c0
    }

    .c3 {
      color: var(--purple)
    }

    .c4 {
      color: #c9a7ff
    }

    .c5 {
      color: #ffb4d1
    }

    .c6 {
      color: var(--gold-soft);
      text-shadow: 0 0 8px rgba(var(--glow2), .6)
    }

    .c7 {
      color: #ffb86b;
      text-shadow: 0 0 10px rgba(255, 184, 107, .7)
    }

    /* 日志区：吃掉剩余高度，内部滚动，页面整体不会被日志撑长。
     * min-height 保证矮屏上也不会被压成一条缝。 */
    .log {
      height: auto;
      min-height: 120px;
      max-height: 46vh;
      overflow-y: auto;
      background: #0b0818;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: .86rem;
      line-height: 1.6
    }

    .log .week-head {
      color: var(--gold);
      font-weight: bold;
      border-top: 1px dashed var(--line);
      padding-top: 4px;
      margin-top: 4px;
      animation: fadeInUp .5s ease both
    }

    .log .good {
      color: var(--green)
    }

    .log .bad {
      color: var(--red)
    }

    .log .sys {
      color: var(--blue)
    }

    .log .talent {
      color: var(--purple)
    }

    .log .exam {
      color: var(--gold)
    }

    .log .ach {
      color: #ffb86b;
      font-weight: bold
    }

    .log>div {
      animation: fadeInUp .3s ease both
    }

    .opts {
      display: grid;
      gap: 6px;
      margin-top: 6px
    }

    .opts .btn {
      text-align: left
    }

    /* ============================================================
     * 界面瘦身（紧凑布局）
     * ------------------------------------------------------------
     * 这几段是专门为"少滚滚轮"加的：
     *   .statgrid  属性栏两列，进度条变细
     *   .actgrid   行动按钮单列（六选一竖排，不再显得空泛）
     *   .subjtoggle 学科栏默认折叠
     * 想恢复原来的宽松版式，把这几段整块删掉即可。
     * ============================================================ */

    .statgrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px 10px
    }

    .stat.compact {
      margin: 1px 0;
      font-size: .78rem
    }

    .stat.compact .bar {
      height: 4px;
      margin-top: 1px
    }

    /* 属性名 + 档位文字一行，档位靠右 */
    .stathead {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 4px
    }

    .stathead .num {
      color: var(--gold)
    }

    /* 档位文字：t0 最糟 → t4 最好（压力由 JS 反向传 tone，配色自动对调） */
    .stathead .lv {
      font-size: .74rem;
      letter-spacing: .5px;
      white-space: nowrap
    }

    .stathead .lv.t0,
    .segbar.t0 i.on {
      color: var(--red);
      background: var(--red)
    }

    .stathead .lv.t1,
    .segbar.t1 i.on {
      color: #ffb86b;
      background: #ffb86b
    }

    .stathead .lv.t2,
    .segbar.t2 i.on {
      color: var(--gold);
      background: var(--gold)
    }

    .stathead .lv.t3,
    .segbar.t3 i.on {
      color: #b9e37a;
      background: #b9e37a
    }

    .stathead .lv.t4,
    .segbar.t4 i.on {
      color: var(--green);
      background: var(--green)
    }

    /* 五格刻度条：只暴露"第几档"，不暴露精确数值 */
    .segbar {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 2px;
      margin-top: 3px
    }

    .segbar i {
      display: block;
      height: 5px;
      border-radius: 2px;
      background: #11152e;
      transition: background .5s ease
    }

    /* 行动按钮：单列竖排。每一行只占一行高，六行也不会把屏幕顶下去 */
    .actgrid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 5px;
      margin-top: 5px
    }

    .actgrid .btn {
      margin: 0;
      padding: 7px 12px;
      font-size: .9rem;
      text-align: left;
      line-height: 1.35
    }

    .actgrid .btn small {
      display: block;
      color: #c8d0f0;
      font-size: .74rem;
      margin-top: 1px
    }

    @media(max-width:420px) {
      .statgrid {
        grid-template-columns: 1fr
      }
    }

    @media(max-width:760px) {
      .log {
        max-height: 40vh
      }
    }

    /* ============================================================
     * 顶栏时间胶囊 / 社团胶囊
     * ============================================================ */

    .timepill,
    .clubpill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: .78rem;
      background: var(--panel2);
      border: 1px solid var(--line);
      color: var(--dim);
      white-space: nowrap
    }

    .timepill b,
    .clubpill b {
      color: var(--gold)
    }

    .clubpill {
      background: linear-gradient(135deg, rgba(var(--brand-rgb), .5), var(--panel2));
      border-color: var(--purple);
      color: var(--txt)
    }

    .clubpill b {
      color: var(--gold-soft)
    }

    /* 主菜单三个文档按钮 */
    .docbtns {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap
    }

    .docbtns .btn {
      flex: 1 1 30%;
      min-width: 120px;
      margin: 0;
      padding: 9px 6px;
      font-size: .85rem
    }

    /* ============================================================
     * Markdown 文档弹窗
     * ============================================================ */

    .markdown {
      line-height: 1.5;
      font-size: .85rem
    }

    .markdown h2 {
      font-size: .98rem;
      color: var(--gold-soft);
      margin: 4px 0 6px;
      padding-bottom: 3px;
      border-bottom: 1px solid var(--line)
    }

    .markdown h2:first-child {
      margin-top: 0
    }

    .markdown h3 {
      font-size: .9rem;
      color: var(--purple);
      margin: 10px 0 3px
    }

    .markdown h4 {
      font-size: .85rem;
      color: var(--txt);
      margin: 8px 0 2px
    }

    .markdown p {
      margin: 4px 0;
      color: var(--txt)
    }

    .markdown ul {
      margin: 3px 0 3px 18px
    }

    .markdown li {
      margin: 1px 0
    }

    .markdown blockquote {
      margin: 6px 0;
      padding: 6px 10px;
      line-height: 1.5;
      border-left: 3px solid var(--gold);
      background: rgba(215, 180, 90, .07);
      color: var(--gold-soft);
      border-radius: 0 8px 8px 0
    }

    .markdown code {
      background: var(--panel2);
      padding: 1px 5px;
      border-radius: 4px;
      font-size: .8rem;
      color: var(--green)
    }

    .markdown hr.mdhr {
      border: 0;
      border-top: 1px dashed var(--line);
      margin: 9px 0
    }

    .markdown table.mdtable {
      width: 100%;
      border-collapse: collapse;
      margin: 6px 0;
      font-size: .8rem
    }

    .markdown .mdtable th {
      background: var(--panel2);
      color: var(--gold-soft);
      padding: 4px 6px;
      text-align: left;
      border: 1px solid var(--line)
    }

    .markdown .mdtable td {
      padding: 4px 6px;
      border: 1px solid var(--line);
      color: var(--txt)
    }

    .markdown .mdtable tr:nth-child(even) td {
      background: rgba(255, 255, 255, .02)
    }

    /* ============================================================
     * 隐藏滚动条（视觉干净，但仍能正常滚动）
     * ------------------------------------------------------------
     * 开关在 js/02-config.js 的 ui.hideScrollbar（默认开）。
     * 想恢复滚动条，把那一项改成 false 即可，不用动这里。
     * ============================================================ */

    /* Chrome / Edge / Safari */
    body.no-scrollbar ::-webkit-scrollbar,
    body.no-scrollbar *::-webkit-scrollbar {
      width: 0;
      height: 0;
      background: transparent
    }

    body.no-scrollbar ::-webkit-scrollbar-thumb,
    body.no-scrollbar *::-webkit-scrollbar-thumb {
      background: transparent;
      border: 0
    }

    body.no-scrollbar ::-webkit-scrollbar-track,
    body.no-scrollbar *::-webkit-scrollbar-track {
      background: transparent
    }

    /* Firefox / 旧 Edge */
    body.no-scrollbar,
    html.no-scrollbar,
    body.no-scrollbar *,
    html.no-scrollbar * {
      scrollbar-width: none;
      -ms-overflow-style: none
    }

    /* 页面级滚动条（归 html 管） */
    html.no-scrollbar::-webkit-scrollbar,
    body.no-scrollbar::-webkit-scrollbar {
      width: 0;
      height: 0;
      background: transparent
    }

    /* ============================================================
     * 滚动提示：内容没看完时，底部一道渐隐
     * ------------------------------------------------------------
     * 隐藏滚动条后玩家可能不知道下面还有内容，
     * 用一道很淡的渐变暗示。开关：ui.scrollHint
     * ============================================================ */

    .scrollfade {
      position: relative
    }

    body.scroll-hint .scrollfade::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 26px;
      pointer-events: none;
      background: linear-gradient(to bottom, rgba(11, 8, 24, 0), rgba(11, 8, 24, .92));
      border-radius: 0 0 12px 12px;
      z-index: 2
    }

    body.scroll-hint .modal .scrollfade::after {
      background: linear-gradient(to bottom, rgba(20, 14, 38, 0), rgba(20, 14, 38, .95))
    }

    /* 已经滚到底就把渐隐去掉（由 JS 打上 .at-end） */
    body.scroll-hint .scrollfade.at-end::after {
      opacity: 0;
      transition: opacity .2s ease
    }

    /* ============================================================
     * 矮屏（1366×768 这类笔记本）：收紧垂直节奏
     * ------------------------------------------------------------
     * 顶栏和卡片的内边距压一档，把省下的高度让给日志与行动面板。
     * ============================================================ */
    @media(max-height:820px) {
      .topline {
        gap: 4px;
        margin-bottom: 6px
      }

      .topline .btn {
        padding: 5px 10px;
        margin: 2px
      }

      .card {
        padding: 8px 10px
      }

      .actgrid .btn {
        padding: 6px 10px
      }
    }

</style>
  <style>
/* ============================================================
 * 弹窗层：模态框、天赋详情、飘字、提示条、成就格
 * ------------------------------------------------------------

    /* ------------------------------------------------------------

    html.mood-stress::before {

      animation: moodBreath 4.2s ease-in-out infinite;

     * 用 filter 而不是叠灰层，这样文字仍然清晰可读。
     */
    html.mood-dark #hud,
    html.mood-dark .topline {
      filter: saturate(calc(1 - .28 * var(--mood-dark, 1))) brightness(calc(1 - .12 * var(--mood-dark, 1)));
      transition: filter 1.2s ease
    }

    /* 强档再压一层冷灰，让"提不起劲"更明显 */
    html.mood-dark[style*="--mood-dark: 2"]::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 39;
      pointer-events: none;
      background: linear-gradient(to bottom, rgba(60, 62, 78, .12), rgba(30, 32, 44, .20));
      mix-blend-mode: multiply;
      transition: background 1.2s ease
    }

    /* ------------------------------------------------------------
     * 健康过低：画面发虚
     * ------------------------------------------------------------
     * 轻微失焦 + 边缘发暗，像蹲久了站起来那一下。
     * 模糊只给 0.6px，看得出"不对劲"但不影响阅读。
     */
    html.mood-weak #hud {
      filter: blur(calc(.6px * var(--mood-weak, 1))) brightness(calc(1 - .08 * var(--mood-weak, 1)));
      transition: filter 1.2s ease
    }

    html.mood-weak::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 38;
      pointer-events: none;
      background: radial-gradient(ellipse 78% 62% at 50% 50%,
          transparent 42%,
          rgba(20, 10, 10, calc(.26 * var(--mood-weak, 1))) 100%)
    }

    /* ------------------------------------------------------------
     * 经济见底：边缘发冷（最轻一档，不喧宾夺主）
     * ------------------------------------------------------------ */
    html.mood-broke::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 37;
      pointer-events: none;
      background: radial-gradient(ellipse 78% 62% at 50% 50%,
          transparent 46%,
          rgba(40, 78, 100, .26) 100%)
    }

    /* ------------------------------------------------------------
     * 兜底：特效层一律不吃点击，也不拦截滚动
     * ------------------------------------------------------------ */
    html[class*="mood-"]::before,
    html[class*="mood-"]::after {
      pointer-events: none
    }

    /* 尊重系统「减少动态效果」设置：只留静态色调，去掉呼吸动画 */
    @media(prefers-reduced-motion:reduce) {
      html.mood-stress::before {
        animation: none
      }

      html.mood-weak #hud {
        filter: brightness(calc(1 - .08 * var(--mood-weak, 1)))
      }
    }

</style>

const GAME_DOCS = {
  guide: {title: "新手介绍", html: "<h2>新手介绍</h2>\n\n<p>欢迎来到<b>中考人生模拟器 · 红塔中学版</b>。</p>\n\n<p>你将扮演一名<b>红塔少年</b>，从初一上学期走到初三中考，</p>\n<p>一共 <b>150 周</b>，约三年的时间。这不是一场考试，是一段生活。</p>\n\n<blockquote>校训「<b>人生在立，行达天下</b>」　|　登上「<b>立行号</b>」，每一步都算数。</blockquote>\n\n<hr class=\"mdhr\">\n\n<h3>一、基本玩法</h3>\n\n<p>每周你会做 <b>1~2 次行动</b>，一周分两个时段：</p>\n\n<table class=\"mdtable\">\n<tr><th>时段</th><th>说明</th></tr>\n<tr><td>🏫 <b>周中</b></td><td>住校的日子。早读、上课、晚自习、熄灯</td></tr>\n<tr><td>🏠 <b>周末</b></td><td>回家或自由安排的两天</td></tr>\n</table>\n\n<p>时段是<b>按先后顺序</b>推进的：一定是先在学校的周中，再是回家的周末。</p>\n<p>不会先回家、再回到宿舍。</p>\n\n<p>行动有六种：</p>\n\n<ul>\n<li>📖 努力学习 —— 涨学力，是中考分数的来源</li>\n<li>😴 好好休息 —— 回健康、降压力</li>\n<li>👥 社交活动 —— 涨社交、结识朋友</li>\n<li>🎮 摸鱼娱乐 —— 放松，但会掉效率</li>\n<li>🏠 向父母要零花钱 —— 拿到经济，金额看<b>亲情</b></li>\n<li>📚 图书角 —— 读书，只给正面的东西</li>\n</ul>\n\n<p><b>每次行动之后，一定会跟一个事件弹窗</b>，偶尔还会连锁出后续。</p>\n\n<hr class=\"mdhr\">\n\n<h3>二、七项属性</h3>\n\n<table class=\"mdtable\">\n<tr><th>属性</th><th>作用</th></tr>\n<tr><td>心态</td><td>太低会崩溃，影响学习收益</td></tr>\n<tr><td>经济</td><td>买书、买道具、吃饭</td></tr>\n<tr><td>健康</td><td>太低会生病、甚至提前离场</td></tr>\n<tr><td>效率</td><td>直接影响学习收益倍率</td></tr>\n<tr><td>悟性</td><td>影响考试分数，也是解锁天赋的\"货币\"</td></tr>\n<tr><td>社交</td><td>影响人际关系类事件</td></tr>\n<tr><td>压力</td><td>太高会扣心态、扣效率</td></tr>\n</table>\n\n<p>还有一项 <b>亲情</b>，不占主属性栏，只在家庭事件和向父母要钱时生效。</p>\n<p>亲情越高，父母越愿意给钱，也越少念叨。</p>\n\n<hr class=\"mdhr\">\n\n<h3>三、天赋不是开局送的</h3>\n\n<p>开局你一无所有。天赋会在一次次选择里<b>长出来</b>：</p>\n\n<ul>\n<li>坚持学习 → 可能获得「专注」「卷王」</li>\n<li>坚持休息 → 可能获得「晨型人」</li>\n<li>读书 → 只给正面的天赋</li>\n<li>社团活动 → 长期参与可能有所收获</li>\n</ul>\n\n<p><b>负面天赋也能消除</b>，这叫「破茧」：</p>\n\n<ul>\n<li>厌学 → 坚持学习 12 次后消失</li>\n<li>网瘾 → 好好休息 10 次后消失</li>\n<li>拖延症 → 坚持学习 16 次后消失，还会送你「自律机器」</li>\n</ul>\n\n<p>天赋面板上会显示进度，比如「厌学 Lv.2 🌱5/12」。</p>\n\n<hr class=\"mdhr\">\n\n<h3>四、关于手机（重要）</h3>\n\n<p>红塔中学对手机<b>零容忍</b>。</p>\n\n<p>如果你在周末选择<b>把手机带去学校</b>，那么接下来几周里：</p>\n\n<ul>\n<li>可能遇到<b>宿舍突击检查</b></li>\n<li>可能遇到<b>熄灯后的诱惑</b></li>\n</ul>\n\n<p>被抓到的后果很重：没收、请家长、取消评优、学习状态下降数周。</p>\n\n<p><b>选择不带，是最聪明的做法。</b> 自律会拿到「自律机器」天赋和学习加成。</p>\n\n<hr class=\"mdhr\">\n\n<h3>五、社团</h3>\n\n<p>社团活动<b>只在周三下午</b>发生，其他时候不会有。</p>\n<p>（唯一例外是花灯社的剧院研学，那是走出校园的活动。）</p>\n\n<p><b>抢社团</b>在每学年<b>上学期第 3~5 周</b>的周末开放：</p>\n<p>初一上、初二上、初三上各一次机会。</p>\n\n<p>红塔中学的社团是<b>抢</b>的——名额有限，手慢无。</p>\n<p>而且<b>窗口只弹一次</b>：抢不上，这一年就没有社团。</p>\n\n<table class=\"mdtable\">\n<tr><th>难度</th><th>社团</th></tr>\n<tr><td>最难抢（约 35%）</td><td>🏀 篮球社、🤸 啦啦操社</td></tr>\n<tr><td>较难（约 45%）</td><td>🏮 花灯社、🎭 话剧社、💻 编程社</td></tr>\n<tr><td>一般（约 60%）</td><td>🖌 国画社、🎨 黏土社、🎵 合唱团、🎙 朗诵社、🔊 英语播音配音社、📷 摄影社、🏓 乒乓球社</td></tr>\n<tr><td>最好抢（约 75%）</td><td>♟ 围棋社</td></tr>\n</table>\n\n<p>入社后，<b>每周三的社团课</b>会有社团的事。</p>\n<p>长期参加（累计 6 次）还可能有所收获。</p>\n\n<p>每学年上学期可以<b>重选社团</b>，但重选会清零累计次数——</p>\n<p>三年待在同一个社团，和每年换一个，是两种玩法。</p>\n\n<hr class=\"mdhr\">\n\n<h3>六、时间与季节</h3>\n\n<p>游戏里有真实的校历时间：<b>9 月开学 → 次年 1 月</b>，<b>2 月开学 → 6 月</b>。</p>\n<p>分春 🌸 / 夏 🌞 / 秋 🍂 / 冬 ❄️ 四季。</p>\n\n<p>有些事件只在特定季节出现：</p>\n\n<ul>\n<li>秋天才有落叶的林荫道</li>\n<li>夏天才有吊扇与蝉鸣</li>\n<li>冬天才有天没亮的早读</li>\n</ul>\n\n<p>顶栏的 📅 会显示当前的月份和季节。</p>\n\n<hr class=\"mdhr\">\n\n<h3>七、小提示</h3>\n\n<ul>\n<li><b>小卖铺、天赋图鉴、成就、道具</b>都属于自由操作，<b>不消耗行动次数</b></li>\n<li>每周行动机会有限，但<b>学科栏可以点开看详情</b></li>\n<li>压力爆表会扣心态，别忘了休息</li>\n<li>中考分数不是唯一结局，还有艺考、体校、职高等多种去向</li>\n</ul>\n\n<hr class=\"mdhr\">\n\n<p><b>祝你在红塔中学的三年，走得踏实。</b></p>\n"},
  changelog: {title: "更新日志", html: "<h2>更新日志</h2>\n\n<h3>v1.0 · 正式版（发布版）</h3>\n\n<p>这是第一个完整版本。界面、数值、文案、体检脚本全部过了一遍，</p>\n<p>可以作为社团成果提交审核、在全校展示。</p>\n\n<p><b>界面：更紧凑，少滚滚轮</b></p>\n\n<ul>\n<li>弹窗内边距、行间距整体收紧（正文行高 1.8 → 1.55），字少不再空一大片</li>\n<li>行动面板改为<b>单列竖排</b>，六个选项一眼看全</li>\n<li>主界面左栏合并：天赋 + 道具并成一张卡，各科 + 成绩并成一张卡</li>\n<li>按钮、卡片、日志区、成就格、Markdown 文档的间距统一压缩</li>\n</ul>\n\n<p><b>修掉一批会影响体验的问题</b></p>\n\n<ul>\n<li>读档后社团会消失 —— 社团、手机标记、事件冷却原本根本没存进存档，已补齐</li>\n<li>「向父母要零花钱」时，父母的台词弹窗会被后面的随机事件直接盖掉，已改成说完再继续</li>\n<li>剧情模式（story）下仍可能因经济归零而「辍学打工」提前结束 ——</li>\n</ul>\n<p>  与该难度「不会中途暴毙」的承诺不符，已加经济保底线</p>\n<ul>\n<li>学力衰减在一周内被计算了两次（每次行动一次 + 周结算一次），</li>\n</ul>\n<p>  导致初三时衰减量超过学习量、学力一路跌回个位数，已去掉重复计算</p>\n<ul>\n<li>体检脚本新增：社团奖励天赋校验、时段/季节合法性校验、</li>\n</ul>\n<p>  「写了却永远拿不到」的死成就检测、条件分支里的指令错别字检查</p>\n\n<p><b>结局与成就</b></p>\n\n<ul>\n<li>「少年班」「平凡而幸福」两条结局排在了分数结局后面，条件再符合也轮不到，已重排</li>\n<li>「冠军之心」「锦鲤本鲤」「竞赛之星」「青春悸动」「干饭之魂」五个成就</li>\n</ul>\n<p>  没有任何地方会为它们计数，已接上计数并补充事件</p>\n<ul>\n<li>「六边形战士」把「压力」也算成一条边（压力高是坏事），已改为只算六项主属性</li>\n<li>补上社团表里缺失的奖励天赋【匠心】【逻辑鬼才】（天赋数 80 → 82）</li>\n</ul>\n\n<p><b>内容与文案</b></p>\n\n<ul>\n<li>每条随机事件都标注了时段（周中 / 周三社团课 / 周末），</li>\n</ul>\n<p>  不会再出现「住校却半夜接手机」「周末还在教室随堂小测」这类时间错误</p>\n<ul>\n<li>新增事件：校门口的小吃摊、课桌里的纸条、陪妈妈去赶集、周日的作业、</li>\n</ul>\n<p>  周末的一顿饭、爬一次红塔山、体艺节前的排练、黑板右上角（初三）、百日誓师</p>\n<ul>\n<li>「社团招新周」与固定日程的社团展演重复，改为「社团开放日」（未入社时才出现）</li>\n<li>「体育艺术文化节」与固定日程撞车，改为节前的排练</li>\n<li>天赋诗句去重 16 处（多处引用同一句诗），并为新增天赋补了诗句</li>\n<li>大量事件、书目、道具文案改写，增强文学性与玉溪本地气息</li>\n</ul>\n\n<p><b>数值</b></p>\n\n<ul>\n<li>中考公式里学力的权重过低（0.7），学力几乎不影响分数，</li>\n</ul>\n<p>  天天摸鱼和天天学习考出的分差不多。已提到 1.3，并把权重做成</p>\n<p>  <code>js/02-config.js</code> 里可调的 <code>exam.subjWeight</code></p>\n<ul>\n<li>参考值（剧情模式）：均衡游玩 ≈ 87 分，偏重学习 ≈ 88 分，长期摸鱼 ≈ 73 分</li>\n</ul>\n\n<hr class=\"mdhr\">\n\n<h3>v0.10 · 真实社团版本</h3>\n\n<p><b>社团改为学校实际名单（13 个）</b></p>\n\n<ul>\n<li>国画、黏土、花灯、合唱、朗诵、话剧、英语播音配音、篮球、啦啦操、乒乓球、围棋、摄影、编程</li>\n<li>移除此前没有依据的 7 个社团</li>\n</ul>\n\n<p><b>社团活动只在周三</b></p>\n\n<ul>\n<li>时段顺序改为：周中 → <b>周三社团课</b> → 周末</li>\n<li>社团事件全部限定在周三社团课，其他时候不会出现</li>\n<li>唯一例外：花灯社的剧院研学（走出校园）安排在周末</li>\n<li>没加入社团时不排「周三社团课」这个时段</li>\n<li>周三社团课的行动选项与平时不同（去社团 / 写作业 / 休息 / 找同学）</li>\n</ul>\n\n<p><b>抢社团改为每学年上学期一次</b></p>\n\n<ul>\n<li>窗口：初一上、初二上、初三上的<b>第 3~5 周</b></li>\n<li>整个窗口只弹一次，抢不上这一年就没有社团</li>\n<li>每学年上学期可重选，重选清零累计次数</li>\n</ul>\n\n<hr class=\"mdhr\">\n\n<h3>v0.9 · 时间与社团版本</h3>\n\n<p><b>新增</b></p>\n\n<ul>\n<li>校历时间系统：月份、季节（春夏秋冬），顶栏实时显示</li>\n<li>一周分「周中 / 周末」两个时段，按时间先后顺序推进</li>\n<li>时段数量<b>动态调整</b>：上周攒下的后续事件会让对应时段自动延长</li>\n<li>社团系统：红塔中学 16 个社团</li>\n<li>初一上第 1~3 周周末<b>抢社团</b>，热门社团手慢无</li>\n<li>入社后社团事件均匀分布在学期中</li>\n<li>长期参与（6 次）可能获得天赋</li>\n<li>每个社团有每周微小加成</li>\n<li>事件分布开关 <code>dist</code>：</li>\n<li><code>uniform</code> 均匀分布（距上次越久概率越高）</li>\n<li><code>decay</code> 出现后衰减</li>\n<li><code>front</code> 前期多 / <code>back</code> 后期多</li>\n<li>事件时段字段 <code>slot</code>、季节字段 <code>season</code>、月份字段 <code>months</code></li>\n<li>事件最小间隔 <code>minGap</code>，避免扎堆</li>\n<li>选项<b>条件分支</b> <code>branch</code>：同一选项按数值走向不同结果</li>\n<li>后续事件挂起 <code>raise</code>：不立刻触发，而是在几周内提高概率</li>\n<li>标记系统 <code>flag</code>：例如\"有没有把手机带到学校\"</li>\n<li>手机事件链：返校前选择 → 带手机才可能被查到 → 被抓有后果</li>\n<li>四季观景事件：春（操场边先绿了）、夏（吊扇与蝉鸣）、冬（早读时天还没亮）</li>\n<li>主菜单三个按钮：新手介绍 / 更新日志 / 鸣谢列表（内容在 docs/*.md 里改）</li>\n</ul>\n\n<p><b>调整</b></p>\n\n<ul>\n<li>宿舍熄灯事件去掉手机选项，改为「和室友聊到很晚」（手机玩法独立成链）</li>\n<li>秋日林荫道改为只在秋季出现</li>\n<li>事件选择引擎重写，支持时段、季节、分布、间隔、挂起</li>\n</ul>\n\n<hr class=\"mdhr\">\n\n<h3>v0.8 · 红塔中学定制版</h3>\n\n<ul>\n<li>填入校训「人生在立，行达天下」、立行文化四立、立行号意象</li>\n<li>主题色改为清华紫 #660874</li>\n<li>15 条红塔中学专属事件（花灯、聂耳、寄宿生活、家校团建等）</li>\n<li>3 张扁平插画风背景（校园全景 / 林荫道 / 立行号列车）</li>\n<li>不使用校徽，只用校名与校训文字</li>\n</ul>\n\n<hr class=\"mdhr\">\n\n<h3>v0.7 · 内容调整</h3>\n\n<ul>\n<li>移除图书馆（学校没有），改为班级图书角</li>\n<li>手机违规惩罚大幅加重</li>\n<li>体育艺术节改为一年一次（上学期第 8 周）</li>\n<li>「打零工」改为「向父母要零花钱」，新增亲情属性</li>\n<li>新增 5 条家庭事件</li>\n<li>读书只给正面天赋，无天赋可给时改为给悟性</li>\n<li>界面瘦身：属性栏双列、行动按钮两列、学科栏可折叠、日志区限高</li>\n<li>天赋图鉴改为紧凑卡片，关闭按钮跟随滚动</li>\n<li>修复多事件弹窗互相覆盖导致卡死的 Bug</li>\n<li>数值边界处理，杜绝 NaN</li>\n</ul>\n\n<hr class=\"mdhr\">\n\n<h3>v0.6 · 开源拆分</h3>\n\n<ul>\n<li>单文件拆分为 40 个文件的项目结构</li>\n<li>引擎层 / 内容层 / 配置层分离</li>\n<li>事件效果支持中文指令写法</li>\n<li>内容体检脚本、单文件打包脚本</li>\n<li>三份文档：文件大纲、内容教程、审核清单</li>\n</ul>\n"},

  <script>
/* ==== 01-utils.js ==== */
/* ==================================================================
 * 工具层 · 数值与日志
 * ==================================================================
 * 随机数、数值夹取、属性增减、日志输出、飘字。
 * 所有"改数字"的操作最终都会走到这里的 modProp()，
 * NaN 防护也在这里统一处理。
 *
 * 维护等级：引擎层（一般不动）
 * ============================================================ */

    let S = null, slotCur = 0;

    const rnd = n => Math.floor(Math.random() * n);

    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    /* ==================================================================
     * 好运判定：事件里所有「看运气」的分支都走这里
     * ------------------------------------------------------------------
     * 这样【锦鲤附体】【乌鸦嘴】两个天赋和【幸运硬币】道具才真的有用
     * —— 以前它们只在天赋表里写着，代码里没人认。
     * 用法：if (luckyRoll(0.5)) { …好运分支… }
     * ================================================================== */
    function luckyRoll(p) {
      let v = clampNum(p, 0, 1, 0.5);
      if (typeof Talent !== "undefined") {
        if (Talent.have("锦鲤附体")) v += 0.15;
        if (Talent.have("乌鸦嘴")) v -= 0.12;
      }
      if (S && S.luckyCharm) v += 0.10;      // 小卖铺的幸运硬币
      return Math.random() < clampNum(v, 0.02, 0.98);
    }

    /* ==================================================================
     * 数值边界：任何进入状态的数字都必须先过这一关，杜绝 NaN / Infinity
     * ================================================================== */

    const num = (v, d = 0) => (typeof v === "number" && isFinite(v)) ? v : d;

    const clampNum = (v, a, b, d = a) => clamp(num(v, d), a, b);

    // 属性的合法区间与兜底值：[下限, 上限, 出问题时兜底成多少]
    // 主界面显示前七项；「亲情」是第八项，只在家庭事件中生效，
    // 不显示在 HUD 属性栏（避免界面变长），在天赋图鉴里能看到。

    const PROP_RANGE = {
      心态: [0, 150, 100], 经济: [0, 1e9, 100], 健康: [0, 150, 100], 效率: [10, 150, 100],
      悟性: [10, 150, 10], 社交: [10, 150, 100], 压力: [0, 150, 10],
      亲情: [10, 150, 80]
    };

    /* ==================================================================
     * 属性可见性（v1.1 起）
     * ------------------------------------------------------------------
     * PROP_HUD     面板上真正看得见的四项：心态 / 经济 / 健康 / 压力
     * PROP_HIDDEN  后台实时计算、面板上一律不出现：效率 / 悟性 / 社交 / 亲情
     * PROP_BLUR    HUD 里除「经济」之外都要模糊化：只给档位文字，不给数字
     *
     * 学科属性（语文 / 数学 ……）不再常驻面板，只在考试事件里显示。
     * 想恢复完整数值面板：把 PROP_HUD 改成 Object.keys(PROP_RANGE)，
     * 并把 PROP_BLUR 改成空数组即可。
     * ================================================================== */
    const PROP_HUD = ["心态", "经济", "健康", "压力"];

    const PROP_HIDDEN = ["效率", "悟性", "社交", "亲情"];

    const PROP_BLUR = ["心态", "健康", "压力"];

    /* ==================================================================
     * 档位：把 0~150 的数值翻译成「极低 / 较低 / 中 / 较高 / 极高」
     * ------------------------------------------------------------------
     * 五档均分，档位宽度 30。面板上只显示档位文字 + 五格刻度条，
     * 玩家看到的是"状态好不好"，不是精确的 87 还是 88。
     * 想改档位文案改 js/01b-i18n.js 的 level.* ；想改宽度改这里的 STEP。
     * ================================================================== */
    const PROP_LEVEL_STEP = 30;

    const PROP_LEVELS = [
      {lv: 0, key: "level.vlow"},
      {lv: 1, key: "level.low"},
      {lv: 2, key: "level.mid"},
      {lv: 3, key: "level.high"},
      {lv: 4, key: "level.vhigh"}
    ];

    /* 数值落在第几档（0~4） */
    function propLevel(v) {
      const x = clamp(num(v, 0), 0, 150);
      return clamp(Math.floor(x / PROP_LEVEL_STEP), 0, 4);
    }

    /* 属性的语义方向：+"越高越好" / -"越高越糟"
     * 压力是唯一反向的 —— 档位文字照写「极高」，但颜色要反过来。 */
    function propPolarity(k) {return k === "压力" ? -1 : 1;}

    /* 档位文字（已过双语层） */
    function propLevelText(k, v) {
      const lv = propLevel(v);
      const key = (PROP_LEVELS[lv] || PROP_LEVELS[2]).key;
      return L(key);
    }

    const SUBJ_CAP = 1500;   // 单科学力上限，防止长期累积后失控

    function fixProp(k, v) {
      const r = PROP_RANGE[k] || [0, 150, 100];
      return clamp(num(v, r[2]), r[0], r[1]);
    }

    function sanitizeProp(p) {
      const out = {};
      for (const k in PROP_RANGE) out[k] = fixProp(k, p ? p[k] : undefined);
      return out;
    }

    function sanitizeSubj(s) {
      const out = {};
      for (const g in SUBJECTS_BY_GRADE)
        SUBJECTS_BY_GRADE[g].forEach(k => {out[k] = clamp(num(s ? s[k] : undefined, 30), 0, SUBJ_CAP);});
      if (s) for (const k in s) if (out[k] === undefined) out[k] = clamp(num(s[k], 30), 0, SUBJ_CAP);
      return out;
    }
    /* 把当前学年的科目补齐/修好，任何 NaN 都会被拉回 30 左右 */

    function ensureSubj() {
      if (!S) return;
      const subs = subjectsOf(S.term) || [];
      for (const k of subs) {
        if (S.subj[k] === undefined || !isFinite(S.subj[k])) S.subj[k] = 25 + rnd(15);
        S.subj[k] = clamp(S.subj[k], 0, SUBJ_CAP);
      }
    }

    function recalcScore() {
      const subs = subjectsOf(S.term) || [];
      S.score = subs.length ? clampNum(subs.reduce((a, x) => a + num(S.subj[x], 0), 0), 0, SUBJ_CAP * 20) : 0;
    }

    /* ==================================================================
     * 真实学习难度曲线
     * ================================================================== */

    /* 剧情模式下的属性保底线。
     * 亲情单独设一条更高的底线（storyFloorFamily），
     * 避免展示时玩家因为几次手机违规就"众叛亲离"，那不是我们想传达的。 */
    function propFloor(k) {
      if (GAME_CONFIG.difficulty !== "story") return 0;
      if (k === "健康" || k === "心态") return GAME_CONFIG.storyFloor;
      if (k === "亲情") return GAME_CONFIG.storyFloorFamily;
      /* 经济也留一条底线：剧情模式承诺「不会中途暴毙」，
       * 而经济归零满 12 周会触发「辍学打工」提前结束 —— 展示时不想看到这个。
       * 想要经济压力，请切到 standard / hard 难度。 */
      if (k === "经济") return GAME_CONFIG.storyFloorMoney;
      return 0;
    }

    function modProp(k, v) {
      if (S.prop[k] === undefined || !isFinite(S.prop[k])) S.prop[k] = fixProp(k, undefined);
      v = num(v, 0);
      if (!v) return;
      const before = S.prop[k];
      S.prop[k] = clamp(S.prop[k] + v, propFloor(k), PROP_RANGE[k] ? PROP_RANGE[k][1] : 150);
      if (S.prop[k] < (PROP_RANGE[k] ? PROP_RANGE[k][0] : 0)) S.prop[k] = PROP_RANGE[k] ? PROP_RANGE[k][0] : 0;
      if (Math.abs(v) >= 1) {
        const good = (k === "压力") ? (v < 0) : (v > 0);
        // 隐藏属性（效率 / 悟性 / 社交 / 亲情）：面板上看不到，
        // 飘一个带数字的字只会暴露它们，改成不带数字的方向提示。
        if (isHiddenProp(k)) {
          if (floatHiddenWanted()) floatGain(`${propName(k)} ${v > 0 ? "▲" : "▼"}`, good);
        } else if (isBlurProp(k) && !floatNumbersWanted()) {
          // 模糊属性且关掉了数字飘字：只说升了还是降了
          floatGain(`${propName(k)} ${v > 0 ? "▲" : "▼"}`, good);
        } else {
          floatGain(`${propName(k)} ${v > 0 ? "+" : ""}${Math.round(v)}`, good);
        }
      }
    }

    /* 该属性是否在面板上隐藏 */
    function isHiddenProp(k) {
      return (typeof PROP_HIDDEN !== "undefined") && PROP_HIDDEN.indexOf(k) >= 0;
    }

    /* 该属性是否要模糊化（只给档位，不给数字） */
    function isBlurProp(k) {
      return (typeof PROP_BLUR !== "undefined") && PROP_BLUR.indexOf(k) >= 0;
    }

    /* 飘字开关，见 GAME_CONFIG.ui */
    function floatNumbersWanted() {
      const u = (typeof GAME_CONFIG !== "undefined" && GAME_CONFIG.ui) || {};
      return u.floatNumbers !== false;
    }

    function floatHiddenWanted() {
      const u = (typeof GAME_CONFIG !== "undefined" && GAME_CONFIG.ui) || {};
      return u.hiddenFloats === true;
    }

    function say(txt, cls = "") {
      /* 单亲 / 留守家庭：日志里爸爸妈妈的称呼也要统一（双亲家庭原样） */
      if (typeof famText === "function" && typeof txt === "string") txt = famText(txt);
      S.logs.push({txt, cls}); const el = document.getElementById("log");
      const d = document.createElement("div"); if (cls) d.className = cls; d.textContent = txt; el.appendChild(d); el.scrollTop = el.scrollHeight;
    }

    function count(k) {
      S.cnt[k] = (S.cnt[k] || 0) + 1;
      bumpCure(k);   // 行动 / 运动 / 高分等计数同步推进「破茧」进度
    }
    /* story 模式下给 健康 / 心态 留一条保底线，避免展示时突然暴毙 */

    let floatIdx = 0;

    function floatGain(txt, good) {
      const d = document.createElement("div");
      d.className = "floatgain";
      d.style.color = good === false ? "var(--red)" : (good === true ? "var(--green)" : "var(--gold)");
      d.style.left = `calc(50% + ${(floatIdx++ % 5 - 2) * 60}px)`;
      d.textContent = txt;
      document.body.appendChild(d);
      setTimeout(() => d.remove(), 1600);
    }

    /* 主入口：L("key", a, b) → 把文案里的 {0} {1} 依次替换 */
    function L(key) {
      const args = Array.prototype.slice.call(arguments, 1);
      let s = null;
      if (LANG !== "zh" && I18N[LANG] && I18N[LANG][key] != null) s = I18N[LANG][key];
      if (s == null && I18N.zh && I18N.zh[key] != null) s = I18N.zh[key];
      if (s == null) return key;
      for (let i = 0; i < args.length; i++) {
        s = s.split("{" + i + "}").join(args[i] == null ? "" : args[i]);
      }
      return s;
    }

    /* 双语对象取值：T({zh:"…", en:"…"}) 或 T("纯字符串") */
    function T(v) {
      if (v == null) return "";
      if (typeof v === "string") return v;
      if (typeof v !== "object") return String(v);
      if (LANG !== "zh" && v[LANG] != null) return v[LANG];
      return v.zh != null ? v.zh : (v.en != null ? v.en : "");
    }

    /* 中文专有名词：英文模式下保留中文（旧内容还没译，先原样显示） */
    function TZ(s) {return s == null ? "" : String(s);}

    /* 属性显示名 */
    function propName(k) {
      const s = L("prop." + k);
      return s === ("prop." + k) ? k : s;
    }

    /* 往某个 id 的元素里塞文本，元素不存在就安静跳过 */
    function setText(id, txt) {
      const el = document.getElementById(id);
      if (el) el.textContent = txt;
      return el;
    }

    /* 时段显示名：SLOTS 里的 {id,name} → 当前语言 */
    function slotName(slot) {
      if (!slot) return "";
      const s = L("slot." + slot.id);
      return s === ("slot." + slot.id) ? (slot.name || slot.id) : s;
    }

    /* 性别显示名：数据里存的还是 男 / 女，只在显示时翻译 */
    function genderName(g) {
      if (g === "女" || g === "Female") return L("cc.female");
      if (g === "男" || g === "Male") return L("cc.male");
      return g || "";
    }

    /* 行动显示名：study / rest / social … → 当前语言 */
    function actionName(k) {
      const s = L("flow." + k);
      return s === ("flow." + k) ? k : s;
    }

    /* ==================================================================
     * 切换语言
     * ============================================================ */
    function setLang(id, silent) {
      const ok = LANGS.some(l => l.id === id);
      LANG = ok ? id : "zh";
      try {localStorage.setItem("htzx_lang", LANG);} catch (e) { }
      if (typeof applyLangToDom === "function") applyLangToDom();
      if (typeof saveSettings === "function") saveSettings();
      if (!silent) toast(LANG === "en" ? L("toast.lang") : L("toast.langZh"));
      // 主菜单是静态 HTML，标签要靠 renderStartExtras 重刷一遍
      if (typeof renderStartExtras === "function") renderStartExtras();
      // 行动按钮是动态生成的，切语言时原地换字（不能重建，会重置本周进度）
      if (typeof relabelActions === "function") relabelActions();
      if (typeof renderHUD === "function" && S) renderHUD();
      return LANG;
    }

    function toggleLang() {
      setLang(LANG === "zh" ? "en" : "zh");
      if (typeof ensureActionPanel === "function") {
        const p = document.getElementById("actionPanel");
        if (p && p.innerHTML !== "" && S && !S.over) {p.innerHTML = ""; ensureActionPanel();}
      }
    }

    /* ==================================================================
     * 把文案刷到页面上
     * ------------------------------------------------------------------
     * 元素上写 data-i18n="key" 就是改文字，
     * 写 data-i18n-html="key" 支持内联标签，
     * 写 data-i18n-ph="key" 改 placeholder，
     * 写 data-i18n-title="key" 改 title。
     * ============================================================ */
    function applyLangToDom() {
      document.documentElement.lang = LANG === "en" ? "en" : "zh-CN";
      const root = document.body;
      if (!root) return;
      const list = root.querySelectorAll("[data-i18n],[data-i18n-html],[data-i18n-ph],[data-i18n-title]");
      for (let i = 0; i < list.length; i++) {
        const el = list[i];
        const k = el.getAttribute("data-i18n");
        if (k) el.textContent = L(k);
        const kh = el.getAttribute("data-i18n-html");
        if (kh) el.innerHTML = L(kh);
        const kp = el.getAttribute("data-i18n-ph");
        if (kp) el.setAttribute("placeholder", L(kp));
        const kt = el.getAttribute("data-i18n-title");
        if (kt) el.setAttribute("title", L(kt));
      }
      const t = document.getElementById("appTitle");
      if (t) t.textContent = L("app.title");
      if (typeof refreshDocTitle === "function") refreshDocTitle();
    }

    function refreshDocTitle() {
      const sc = (typeof GAME_CONFIG !== "undefined" && GAME_CONFIG.school) ? GAME_CONFIG.school : {};
      document.title = L("app.title") + " · " + (sc.name || "");
    }

    /* ==================================================================
     * 文档弹窗：英文模式下提示"仍在补译"
     * ------------------------------------------------------------------
     * 覆盖 js/00-docs.js 里的同名函数（本文件在它之后加载）。
     * ================================================================== */
    function openDoc(key) {
      const d = (typeof GAME_DOCS !== "undefined") && GAME_DOCS[key];
      if (!d) {if (typeof toast === "function") toast(L("doc.missing")); return;}
      const note = (LANG !== "zh")
        ? `<p style="color:var(--dim);font-size:.78rem;margin-top:8px">This document is still in Chinese — translation in progress.</p>`
        : "";
      showModal(d.title, '<div class="markdown">' + d.html + '</div>' + note,
        [{t: L("modal.close"), fn: function () { }}], null, false, true, {kind: "doc"});
    }

  <script>

/* ==================================================================
 * 配置层 · 学校特色与玩法参数

 *
 * 维护等级：配置层（随便改）
 * ============================================================ */

    const GAME_CONFIG = {
      // —— 学校特色 ——
      school: {
        name: "玉溪市红塔中学",
        subName: "玉溪一中附属中学",
        motto: "人生在立，行达天下",
        // 学生称谓：游戏文案里用「红塔少年」称呼玩家
        studentName: "红塔少年",
        // 学校文化关键词，出现在开学典礼等固定事件里
        culture: ["立德", "立志", "立学", "立身"],
        // 迎新口号：登上立行号，向未来出发
        slogan: "每一步 都算数",
        train: "立行号",       // 学校把入学比作登上一趟列车
      },

      // —— 每周节奏 ——
      // 每周可以选几次「本周行动」，按学期 0~5 排列（初一上→初三下）
      // 想让一局短一点，就把数字调小，例如全部改成 1
      actionsPerWeek: [2, 2, 2, 2, 1, 1],

      // —— 一周的时间结构（周中 / 周末）——
      // 一周之内分为「周中」（住校）和「周末」（回家/自由），
      // 事件必须按 周中 → 周末 的先后顺序发生，不会先回家再住校。
      week: {
        // 一周的时间顺序固定为：周中 → 周三社团课 → 周末
        // 数字 = 该时段给几次行动机会；填 0 就是不出现
        slots: {weekday: 1, clubday: 1, weekend: 1},
        dynamic: true,                     // 上周攒了后续事件 → 对应时段自动 +1
        maxExtra: 1,                       // 每个时段最多额外加几次
        clubOnlyWhenJoined: true           // 没社团就不排「周三社团课」，省一次点击
      },

      // —— 事件分布方式的全局默认 ——
      // 单个事件可以用自己的 dist 覆盖，见 docs/CONTENT_GUIDE.md
      eventDist: {
        mode: "decay",     // "uniform" 均匀 | "decay" 出现后衰减 | "front" 前期多 | "back" 后期多
        decay: 0.5,        // decay 模式：每出现一次权重 ×0.5
        decayFloor: 0.15,  // 最低不低于原权重的 15%
        minGap: 0          // uniform 模式：两次出现至少间隔几周（0=不限制）
      },

      // 每次「本周行动」之后，必定跟随几个随机事件
      eventsPerAction: 1,

      // 随机事件后面还能再连锁几个（0 = 不连锁，2 = 最多再跟 2 个）
      maxChainEvents: 2,

      // 连锁触发概率，按顺序递减：[第 1 次连锁, 第 2 次连锁]
      chainChance: [0.40, 0.20],

      // 每周事件总数硬上限（防止一局被拉得太长）
      maxEventsPerWeek: 4,

      // 事件结果的展示方式
      //   "popup" = 弹窗完整展示（推荐，看得清）
      //   "log"   = 直接写进右侧日志，不弹窗（一局能快一倍）
      eventResultMode: "popup",

      // 难度：
      //   "story"  展示/剧情模式 —— 健康与心态有保底，几乎不会中途暴毙（全校展示推荐）

      //   "hard"   硬核模式 —— 更容易被压力和经济拖垮

      ui: {

      // 屏幕会随玩家状态变化：压力红雾、心态灰暗、健康发虚、经济见底发冷。

      mood: {
        enabled: true,
        stressAt: 100,   // 压力 ≥ 此值：红雾拉满
        warnAt: 78,      // 压力 ≥ 此值：红雾轻微出现（预警）

      /* ==============================================================
       * 学习难度（v1.1 起：比 1.0 明显更难）
       * --------------------------------------------------------------
       * 四个旋钮同时收紧，想调回原版把四个数都改成 1 即可。

       * ============================================================== */
      study: {

      LANG = d.lang;
      applyThemeSkin(d.theme);

    ];

    const SLOT_MAP = {};
    SLOTS.forEach(s => {SLOT_MAP[s.id] = s;});

    /* 时段先后次序（数字小的先发生） */
    const SLOT_ORDER = {weekday: 0, clubday: 1, weekend: 2};

    /* 把「第几周」翻译成校历时间
     * 返回 {wit, month, season, monthIdx, weekOfMonth, dateText} */
    function weekInfo(week, term) {
      const w = clampNum(week, 0, 9999, 0);
      const wit = w % (WEEKS_PER_TERM + 1);
      const months = (clampNum(term, 0, 9, 0) % 2 === 0) ? TERM_MONTHS.even : TERM_MONTHS.odd;
      const mi = clamp(Math.floor(wit / 5), 0, months.length - 1);
      const month = months[mi];
      const season = MONTH_SEASON[month] || "秋";
      return {
        wit: wit,
        month: month,
        monthIdx: mi,
        weekOfMonth: (wit % 5) + 1,
        season: season,
        seasonIcon: SEASON_ICON[season] || "🍂",
        dateText: `${month}月 · ${season}`,
        fullText: `${month}月第${(wit % 5) + 1}周 · ${SEASON_ICON[season] || ""}${season}`
      };
    }

    /* 当前时间的简短文本，用于 HUD */
    function nowTimeText() {
      if (!S) return "";
      const w = weekInfo(S.week, S.term);
      const slot = SLOT_MAP[S.slot] || SLOTS[0];
      return `${w.month}月 · ${w.seasonIcon}${w.season} · ${slot.icon}${slot.name}`;
    }

    /* 生成这一周的时段序列 —— 数量是动态的
     * ------------------------------------------------------------------
     * 不是固定的"周中1次+周末1次"，而是：
     *   1. 按配置给出基础时段（默认 周中1 + 周末1）
     *   2. 若上一周攒下了「待触发的后续事件」，且它指定发生在某个时段，
     *      就给那个时段额外加一次机会（有上限）
     * 这样：前面触发了连锁，后面对应的时段就会自然变多。
     * ================================================================== */
    function buildWeekSlots() {
      const cfg = GAME_CONFIG.week || {};
      const base = cfg.slots || {weekday: 1, weekend: 1};
      const plan = [];
      const push = (slot, n) => {for (let i = 0; i < n; i++) plan.push(slot);};

      push("weekday", Math.max(0, Math.round(num(base.weekday, 1))));
      // 周三社团课：没加入社团就不排这个时段（省掉一次空点击）
      const cd = Math.max(0, Math.round(num(base.clubday, 0)));
      if (cd > 0) {
        const onlyJoined = cfg.clubOnlyWhenJoined !== false;
        if (!onlyJoined || (S && S.club)) push("clubday", cd);
      }
      push("weekend", Math.max(0, Math.round(num(base.weekend, 1))));

      // 动态补时：上周挂起的后续事件指定在某个时段 → 那个时段 +1
      if (cfg.dynamic !== false && S && S.pending) {
        const now = num(S.week, 0);
        const extraCap = Math.max(0, Math.round(num(cfg.maxExtra, 1)));
        const bucket = {};
        S.pending.forEach(p => {
          if (now > num(p.until, 0)) return;                 // 已过期
          const s = p.slot || "weekend";
          bucket[s] = (bucket[s] || 0) + 1;
        });
        Object.keys(bucket).forEach(s => {
          const add = Math.min(extraCap, bucket[s] > 0 ? 1 : 0);
          for (let i = 0; i < add; i++) plan.push(s);
        });
      }

      // 按 周中 → 周三社团课 → 周末 排序，保证时间先后顺序
      const order = SLOT_ORDER;
      plan.sort((a, b) => (order[a] == null ? 9 : order[a]) - (order[b] == null ? 9 : order[b]));
      return plan.length ? plan : ["weekday"];
    }

    /* 清理过期的待触发事件 */
    function flushPending() {
      if (!S || !S.pending) return;
      const now = num(S.week, 0);
      S.pending = S.pending.filter(p => num(p.until, 0) >= now);
    }

    /* 挂起一个后续事件：在 weeks 周内提高它的出现概率 */
    function raiseEvent(id, weeks, mult, slot) {
      if (!S) return;
      if (!Array.isArray(S.pending)) S.pending = [];
      S.pending = S.pending.filter(p => p.id !== id);
      S.pending.push({
        id: id,
        until: num(S.week, 0) + Math.max(1, Math.round(num(weeks, 2))),
        mult: Math.max(1, num(mult, 3)),
        slot: slot || ""
      });
    }

    /* 某个事件当前是否处于「被挂起」状态，返回倍率（1 = 没挂起） */
    function pendingMult(id) {
      if (!S || !Array.isArray(S.pending)) return 1;
      let m = 1;
      S.pending.forEach(p => {if (p.id === id) m = Math.max(m, num(p.mult, 1));});
      return m;
    }

    /* 季节文案（用于 HUD 与事件开头） */
    function seasonLine() {
      if (!S) return "";
      const w = weekInfo(S.week, S.term);
      return SEASON_DESC[w.season] || "";
    }

</script>

  <script>
/* ==== 03c-family.js ==== */
/* ==================================================================
 * 内容层 · 亲情与家庭称呼
 * ==================================================================
 * 两件事：
 *   1. 亲情逻辑：要钱掉亲情、亲情低会触发家庭矛盾、也会要不到钱
 *   2. 家庭称呼：带「单亲家庭」天赋时，事件里的爸爸妈妈不会再换来换去
 *
 * 维护等级：内容层（可直接改文案与数值）
 * ================================================================== */

    /* ---------------- 配置读取 ---------------- */

    function famCfg() {
      const f = (typeof GAME_CONFIG !== "undefined" && GAME_CONFIG.family) || {};
      return {
        askCost: num(f.askCost, 6),
        askCostRich: num(f.askCostRich, 2),
        lowAt: num(f.lowAt, 40),
        conflictAt: num(f.conflictAt, 30),
        conflictChance: num(f.conflictChance, 0.35),
        weeklyDrop: num(f.weeklyDrop, 0.45),
        weeklyDropVal: num(f.weeklyDropVal, 4)
      };
    }

    function famOf() {
      if (!S || !S.prop) return 80;
      return clampNum(S.prop.亲情, 0, 150, 80);
    }

    /* ==================================================================
     * 家庭称呼：单亲家庭只会有一个大人
     * ------------------------------------------------------------------
     * S.familyMain 记录"家里是谁" —— "妈" 或 "爸"。
     * 普通家庭：事件里写妈妈就是妈妈，写爸爸就是爸爸（原样）。
     * 单亲家庭：两种称呼一律收敛成同一位家长，不会再一会爸爸一会妈妈。
     * 留守少年：父母在外，家里说话的是奶奶。
     *
     * ★ 想改称呼，只改下面 PARENT_WORD 这一张表。
     * ================================================================== */

    const PARENT_WORD = {
      mom: {zh: "妈妈", en: "Mum"},
      dad: {zh: "爸爸", en: "Dad"},
      grandma: {zh: "奶奶", en: "Grandma"},
      grandpa: {zh: "爷爷", en: "Grandpa"}
    };

    /* 这位家长在游戏里叫什么 */
    function parentCall(which) {
      const w = PARENT_WORD[which] || PARENT_WORD.mom;
      return (typeof LANG !== "undefined" && LANG === "en") ? w.en : w.zh;
    }

    /* 家里现在主要靠谁（缓存，避免每次都随机）
     * ★ 家庭结构变了（比如中途拿到/失去「单亲家庭」）会重新定一次。 */
    function familyMain() {
      if (!S) return "mom";
      const type = (typeof familyType === "function") ? familyType() : "both";
      const cur = S.familyMain;
      const okSingle = (cur === "mom" || cur === "dad");
      const okLeft = (cur === "grandma");

      if (type === "left") {if (!okLeft) S.familyMain = "grandma"; return S.familyMain;}
      if (type === "single") {
        if (!okSingle) S.familyMain = Math.random() < 0.5 ? "mom" : "dad";
        return S.familyMain;
      }
      return cur || "mom";
    }

    /* 家庭结构：single 单亲 / left 留守 / both 双亲 */
    function familyType() {
      if (typeof Talent === "undefined") return "both";
      if (Talent.have("留守少年")) return "left";
      if (Talent.have("单亲家庭")) return "single";
      return "both";
    }

    /* ==================================================================
     * 事件文本里的家长称呼统一替换
     * ------------------------------------------------------------------
     * 用法：渲染事件前对 title / body / 选项文字跑一遍 famText()。
     * 双亲家庭：原样返回（事件里写什么就是什么）。
     * 单亲 / 留守：所有"爸爸""妈妈""爸妈"都收敛成同一位家长。
     * ================================================================== */

    function famText(s) {
      if (s == null) return s;
      if (typeof s !== "string") return s;
      const type = familyType();
      if (type === "both") return s;             // 双亲家庭不需要改
      if (s.indexOf("妈") < 0 && s.indexOf("爸") < 0 && s.indexOf("父母") < 0 && s.indexOf("家长") < 0) return s;

      const who = parentCall(familyMain());
      let out = s;

      if (type === "left") {
        // 留守：爸妈都在外地，家里管你的是爷爷奶奶
        out = out.replace(/妈妈/g, parentCall("grandma"));
        out = out.replace(/爸爸/g, parentCall("grandpa"));
        return out;                 // 「爸妈 / 父母」保留，因为说的确实是那两个人
      }

      // 单亲：一律用同一位家长
      out = out.replace(/爸妈|父母|家长/g, who);
      out = out.replace(/妈妈|母亲/g, who);
      out = out.replace(/爸爸|父亲/g, who);
      return out;
    }

    /* ==================================================================
     * 亲情数值操作
     * ================================================================== */

    /* 要一次钱 → 掉多少亲情（亲情本来就低时掉得更多，形成恶性循环） */
    function askCostFam() {
      const c = famCfg(), fam = famOf();
      if (fam >= 120) return c.askCostRich;
      if (fam >= 80) return Math.round(c.askCost * 0.6);
      return c.askCost;
    }

    /* 亲情是否低到"开口都难" */
    function famLow() {return famOf() < famCfg().lowAt;}

    /* ==================================================================
     * 家庭矛盾：亲情过低时触发
     * ------------------------------------------------------------------
     * 负面效果是实打实的：心态、压力、效率都受挫，且亲情再掉一截。
     * 触发后设一个冷却，不会连续几周连环炸。
     * ================================================================== */

    const FAMILY_CONFLICTS = [
      {
        t: "饭桌上的沉默",
        c: "晚饭时你多夹了一筷子菜，{p}把碗一放：「你现在眼里还有这个家吗？」\n你低头扒饭，没接话。\n碗筷碰撞的声音，比吵起来还难熬。",
        say: "饭桌上的一句话，堵了你一整晚。",
      },
      {
        t: "电话里的争吵",
        c: "你在电话里提了一句想要买资料，{p}在那头沉默了很久。\n「上周不是刚给过？」\n你说那是用完了，{p}说：「那你说说花在哪了。」\n你忽然觉得很累。",
        say: "电话挂断后，宿舍安静得能听见走廊的灯管在响。",
      },
      {
        t: "成绩单被翻了出来",
        c: "{p}收拾房间时翻出了上次考试的卷子。\n分数就印在右上角，谁都看得见。\n「这就是你说的好好学？」\n你想解释，但张开嘴发现自己也没有底气。",
        say: "你躲进房间，把那张卷子压在了抽屉最底下。",
      },
      {
        t: "谁也不肯先开口",
        c: "周末回家，你和{p}一整天没说超过三句话。\n不是不在乎，是都太累了 —— 一个累于生计，一个累于期待。\n晚上你听见客厅的电视一直开着，其实没人看。",
        say: "有些隔阂不是吵出来的，是慢慢长出来的。",
      },
    ];

    /* 是否该在本周结算时触发一次家庭矛盾 */
    function shouldFamilyConflict() {
      const c = famCfg();
      if (famOf() >= c.conflictAt) return false;
      if (S.famConflictWeek != null && Math.abs(num(S.week, 0) - num(S.famConflictWeek, 0)) < 3) return false;  // 冷却 3 周
      return Math.random() < c.conflictChance;
    }

    /* 弹一次家庭矛盾（返回弹窗定义，由调用方 showPopup） */
    function buildFamilyConflict() {
      const e = FAMILY_CONFLICTS[rnd(FAMILY_CONFLICTS.length)];
      const p = parentCall(familyMain());
      S.famConflictWeek = num(S.week, 0);

      const body = famText(e.c).replace(/\{p\}/g, p);
      return {
        kind: "event",
        badge: L("fam.badge"),
        title: famText(e.t).replace(/\{p\}/g, p),
        body: `<div style="line-height:2.2">${body.replace(/\n/g, "<br>")}</div>`,
        options: [{
          t: L("fam.apologize"),
          fn: () => {
            modProp("心态", -6); modProp("压力", 8); modProp("效率", -6); modProp("亲情", 4);
            say(L("fam.apologizeLog", e.say), "bad");
          }
        }, {
          t: L("fam.shutup"),
          fn: () => {
            modProp("心态", -10); modProp("压力", 12); modProp("效率", -4); modProp("亲情", -5);
            say(L("fam.shutupLog", e.say), "bad");
          }
        }, {
          t: L("fam.hug"),
          cond: () => famOf() >= 20,
          fn: () => {
            modProp("心态", -2); modProp("压力", 2); modProp("亲情", 10);
            say(L("fam.hugLog"), "good");
          }
        }]
      };
    }

  <script>
/* ==== 03b-mood.js ==== */
/* ==================================================================
 * 界面层 · 氛围特效（屏幕情绪）
 * ==================================================================
 * 让画面本身替玩家"感受"状态：
 *   压力爆表  → 四周涌起红雾 .mood-stress
 *   心态过低  → 整屏褪色灰暗 .mood-dark
 *   健康过低  → 画面失血发虚 .mood-weak
 *   经济见底  → 边角发冷发青 .mood-broke（最弱一档，不喧宾夺主）
 *
 * 三档强度：0 关 / 1 轻 / 2 重。数值越糟档位越高，特效越强。
 * 全部走 CSS 变量与 class，不改任何 DOM 结构，也不碰存档数据。
 *
 * 开关：GAME_CONFIG.mood（enabled / stressAt / darkAt / weakAt / brokeAt）
 *
 * 维护等级：界面层
 * ================================================================== */

    const MOOD_CLASSES = ["mood-stress", "mood-dark", "mood-weak", "mood-broke"];

    /* 上一次的状态，用于避免每帧重复写 class */
    let MOOD_LAST = "";

    function moodCfg() {
      const m = (typeof GAME_CONFIG !== "undefined" && GAME_CONFIG.mood) || {};
      return {
        enabled: m.enabled !== false,
        stressAt: num(m.stressAt, 100),
        darkAt: num(m.darkAt, 35),
        weakAt: num(m.weakAt, 30),
        brokeAt: num(m.brokeAt, 20),
        warnAt: num(m.warnAt, 78)      // 预警档：还没爆表，先给一点提示
      };
    }

    /* ==================================================================
     * 计算当前应该挂哪些 class
     * ------------------------------------------------------------------
     * 每一档都写成 "类名:强度"，强度 1 = 轻，2 = 重。
     * 最后由 CSS 按强度调 --mood-* 这几个变量。
     * ================================================================== */
    function moodState() {
      const out = {};
      if (!S) return out;
      const c = moodCfg();
      if (!c.enabled) return out;

      const st = clampNum(S.prop.压力, 0, 150, 0);
      const md = clampNum(S.prop.心态, 0, 150, 100);
      const hp = clampNum(S.prop.健康, 0, 150, 100);
      const mo = clampNum(S.prop.经济, 0, 1e9, 100);

      // 压力：先预警，再爆表
      if (st >= c.stressAt) out["mood-stress"] = 2;
      else if (st >= c.warnAt) out["mood-stress"] = 1;

      // 心态：越低越灰
      if (md <= c.darkAt) out["mood-dark"] = 2;
      else if (md <= c.darkAt + 20) out["mood-dark"] = 1;

      // 健康：越低越虚
      if (hp <= c.weakAt) out["mood-weak"] = 2;
      else if (hp <= c.weakAt + 20) out["mood-weak"] = 1;

      // 经济：见底时边缘发冷（最轻的一档）
      if (mo <= c.brokeAt) out["mood-broke"] = 1;

      return out;
    }

    /* ==================================================================
     * 把状态刷到 <html> 上
     * ------------------------------------------------------------------
     * 只在状态真的变了时才写 DOM —— renderHUD 每周会调好几次，
     * 无脑重写 class 会让 CSS 动画反复重启，红雾会一直闪。
     * ================================================================== */
    function updateMood() {
      const root = document.documentElement;
      if (!root || !root.classList) return;
      const st = moodState();

      // 结局画面不压特效：那是一段收束，不该再被红雾盖住
      const ending = S && S.over;
      const keys = Object.keys(st);
      const sig = ending ? "" : keys.sort().map(k => k + st[k]).join("|");
      if (sig === MOOD_LAST) return;
      MOOD_LAST = sig;

      MOOD_CLASSES.forEach(c => root.classList.remove(c));
      root.style.removeProperty("--mood-stress");
      root.style.removeProperty("--mood-dark");
      root.style.removeProperty("--mood-weak");
      root.style.removeProperty("--mood-broke");
      if (ending) return;

      keys.forEach(k => {
        root.classList.add(k);
        const lvl = clampNum(st[k], 1, 2, 1);
        const varName = "--mood-" + k.slice(5);        // mood-stress → --mood-stress
        root.style.setProperty(varName, String(lvl));
      });
    }

    /* 关掉全部特效（设置里点一下，或进结局时调用） */
    function clearMood() {
      const root = document.documentElement;
      if (!root || !root.classList) return;
      MOOD_CLASSES.forEach(c => root.classList.remove(c));
      MOOD_LAST = "";
    }

    /* ==================================================================
     * 氛围文案：状态糟糕时在日志里轻轻提一句（每周最多一次）
     * ================================================================== */
    let moodSaidWeek = -1;

    function moodWhisper() {
      if (!S) return;
      const c = moodCfg();
      if (!c.enabled) return;
      if (moodSaidWeek === num(S.week, -1)) return;      // 一周只说一次
      const st = clampNum(S.prop.压力, 0, 150, 0);
      const md = clampNum(S.prop.心态, 0, 150, 100);
      const hp = clampNum(S.prop.健康, 0, 150, 100);
      let line = "";
      if (st >= c.stressAt) line = L("mood.stress");
      else if (md <= c.darkAt) line = L("mood.dark");
      else if (hp <= c.weakAt) line = L("mood.weak");
      if (!line) return;
      moodSaidWeek = num(S.week, -1);
      say(line, "bad");
    }

    /* ==================================================================
     * 负面天赋名单
     * ------------------------------------------------------------------
     * 读书永远只给正面的东西 —— 这是本项目的教育立场。
     * 读书角抽天赋时，下面这些一律排除。
     * ★ 加了新的负面天赋，记得也加到这里。
     * ================================================================== */
    const BAD_TALENTS = [
      "厌学", "重度厌学", "学习特困生", "注意力涣散", "拖延症", "迟钝",
      "网瘾", "严重网瘾", "夜猫子", "长期失眠", "多动症", "内耗者",
      "玻璃心", "暴躁", "深度抑郁", "社恐", "社交恐惧", "考试焦虑", "体弱多病",
      "家徒四壁", "单亲家庭", "留守少年", "偏食",
    ];

    /* 判断一个天赋是不是负面的
     * ------------------------------------------------------------------
     * 先看名单（最准），名单没写的再看描述：
     *   描述里出现减益词（下降/降低/减半/变慢/停滞/消耗变大 ……）
     *   且没有出现「+」这类增益写法 → 判为负面。
     * 只有一句话的取舍：读书只给正面的东西，宁可判严一点也不判漏。
     * ================================================================== */
    function isBadTalent(name) {
      if (BAD_TALENTS.indexOf(name) >= 0) return true;
      const d = (TALENTS[name] && TALENTS[name].desc) || "";
      if (!d) return false;
      const bad = /下降|降低|减半|变差|变慢|停滞|额外|不稳定|波动|消耗变大|大起大落|概率下降|-\d/.test(d);
      if (!bad) return false;
      // 有「+N」这种明显增益的，算有得有失，不判负面（名单里已点名的除外）
      return !/\+\s*\d/.test(d);
    }

    /* 给某一科加学力，统一走边界处理（不会越界、不会出现 NaN） */
    function addSubj(S, k, v) {
      S.subj[k] = clamp(num(S.subj[k], 30) + num(v, 0), 0, SUBJ_CAP);
      recalcScore();
    }

    /* 抽一个「正面且没拥有」的天赋；抽不到就返回 null */

    function pickGoodTalent(minLv, maxLv) {
      const pool = Object.keys(TALENTS).filter(t => {
        const lv = TALENTS[t].lv;
        return lv >= minLv && lv <= maxLv && !Talent.have(t) && !isBadTalent(t);
      });
      return pool.length ? pool[rnd(pool.length)] : null;
    }

      {n: "《苏东坡传》", cost: 35, eff: S => {modProp("心态", 10); modProp("社交", 5); modProp("压力", -5);}, d: "一蓑烟雨任平生。", lore: "回首向来萧瑟处，归去，也无风雨也无晴。"},
      {n: "《几何原本》", cost: 45, eff: S => {addSubj(S, "数学", 25); modProp("悟性", 4); modProp("压力", 8);}, d: "逻辑之美。", lore: "点、线、面，构成了这个世界最底层的逻辑。"},
      {n: "《英语晨读》", cost: 30, eff: S => {addSubj(S, "英语", 25); modProp("效率", 3); modProp("压力", 4);}, d: "语感在朗读中生长。", lore: "The early bird catches the worm."},
      {n: "《古文观止》", cost: 35, eff: S => {addSubj(S, "语文", 25); modProp("悟性", 4); modProp("压力", 5);}, d: "文言雅韵。", lore: "先天下之忧而忧，后天下之乐而乐。"},
      {n: "《万历十五年》", cost: 40, eff: S => {addSubj(S, "历史", 25); modProp("悟性", 4); modProp("压力", 6);}, d: "以小见大。", lore: "历史的尘埃落在一个人的头上，就是一座山。"},
      {n: "《物种起源》", cost: 45, eff: S => {addSubj(S, "生物", 25); modProp("悟性", 4); modProp("压力", 6);}, d: "自然选择的伟力。", lore: "物竞天择，适者生存。"},
      {n: "《物理世界奇遇记》", cost: 45, eff: S => {addSubj(S, "物理", 25); modProp("悟性", 4); modProp("压力", 7);}, d: "物理也可以很有趣。", lore: "如果你能理解相对论，说明你还没疯。"},
      {n: "《元素的故事》", cost: 45, eff: S => {addSubj(S, "化学", 25); modProp("悟性", 4); modProp("压力", 6);}, d: "化学元素的前世今生。", lore: "万物皆由元素组成，包括你和我。"},
      {n: "《论语》", cost: 30, eff: S => {modProp("心态", 10); modProp("悟性", 5); modProp("社交", 3);}, d: "温故而知新。", lore: "学而时习之，不亦说乎？"},
      {n: "《道德经》", cost: 25, eff: S => {modProp("心态", 14); modProp("压力", -14); modProp("效率", -3);}, d: "上善若水。", lore: "道可道，非常道；名可名，非常名。"},
      {n: "《孙子兵法》", cost: 35, eff: S => {modProp("悟性", 9); modProp("效率", 5); modProp("压力", -3);}, d: "知己知彼。", lore: "兵者，诡道也。"},
      {n: "《昆虫记》", cost: 25, eff: S => {addSubj(S, "生物", 20); modProp("心态", 6);}, d: "微观世界的大千。", lore: "在蚂蚁的世界里，也有战争与和平。"},

    function openBookCorner(onDone) {
      const normal = BOOKS.filter(b => b.cost < 100);
      const special = BOOKS.filter(b => b.cost >= 100);
      const shuffled = [...normal].sort(() => Math.random() - 0.5);
      const picked = special.length > 0
        ? [...shuffled.slice(0, 2), special[rnd(special.length)]]
        : shuffled.slice(0, 3);
      let read = false;
      let closedByCancel = false;

      const opts = picked.map(b => ({
        t: TZ(b.n), sub: L("book.cost", b.cost),
        disabled: () => S.prop.经济 < b.cost,
        fn: () => {
          if (S.prop.经济 < b.cost) {say(L("book.poor"), "bad"); return;}
          modProp("经济", -b.cost);
          b.eff(S);
          count("read");
          S.didReadWeek = num(S.week, 0);
          read = true;

          }], () => {if (onDone) onDone();}, false, false, {kind: "free", badge: L("book.badge"), img: b.img});
        }
      }));
      opts.push({t: L("modal.cancel"), fn: () => {closedByCancel = true;}});

      showModal(L("book.title"), `<div>${L("book.body")}<br><span style="color:var(--dim);font-size:.85rem">${L("book.money", Math.round(S.prop.经济))}</span></div>`, opts, () => {
        if (closedByCancel || !read) {
          say(L("book.putBack"), "sys");
          setTimeout(ensureActionPanel, 0);
          return;
        }
        if (onDone) onDone();
      }, false, true, {kind: "free", badge: L("book.badge")});
    }

    function gradeNow() {
      return clamp(Math.floor(clampNum(S && S.term, 0, 9, 0) / 2), 0, 2);
    }

    function pickQuiz() {
      const g = gradeNow();
      const subs = (typeof subjectsOf === "function" ? subjectsOf(S.term) : []) || [];
      const usable = subs.filter(s => QUIZ_BANK[s] && QUIZ_BANK[s].length);
      if (!usable.length) return null;

      const sub = usable[rnd(usable.length)];
      const bank = QUIZ_BANK[sub].filter(x => num(x.g, 0) <= g);
      const pool = bank.length ? bank : QUIZ_BANK[sub];
      const raw = pool[rnd(pool.length)];
      if (!raw) return null;

      const item = {sub, type: raw.type === "fill" ? "fill" : "choice", q: raw.q, ans: String(raw.ans), why: raw.why || ""};

      if (item.type === "choice") {
        const opts = (raw.opts || []).slice();
        if (opts.length < 2) return null;
        // 洗牌，避免同一道题永远是同一个正确位置
        for (let i = opts.length - 1; i > 0; i--) {
          const j = rnd(i + 1);
          const t = opts[i]; opts[i] = opts[j]; opts[j] = t;
        }
        item.opts = opts.map(String);
        item.ansIndex = Math.max(0, item.opts.indexOf(String(raw.ans)));
      }
      return item;
    }

    function quizMatch(input, ans) {
      const norm = s => String(s == null ? "" : s)
        .trim()
        .toLowerCase()
        .replace(/\s+/g, "")
        .replace(/[（）()]/g, "")
        .replace(/[。．.,，、]/g, "")
        .replace(/₂/g, "2").replace(/₂/g, "2")
        .replace(/²/g, "2")
        .replace(/×/g, "*");
      const a = norm(input), b = norm(ans);
      if (!a) return false;
      if (a === b) return true;
      // 数学：允许 "x=4" 只填 "4"
      if (b.indexOf("=") >= 0 && a === b.split("=").pop()) return true;
      return false;
    }

    /* 抢社团的成功率（0~1） */
    function clubGrabChance(cid) {
      const c = CLUB_MAP[cid];
      if (!c) return 0.5;
      const base = {1: 0.85, 2: 0.75, 3: 0.6, 4: 0.45, 5: 0.35}[clampNum(c.pop, 1, 5, 3)] || 0.6;
      // 效率高 = 手速快、网速好
      const eff = clampNum(S.prop.效率, 10, 150, 100);
      const bonus = clampNum((eff - 100) * 0.004, -0.15, 0.2);
      // 热门社团第二次抢会容易一点（别人退了）
      const retry = (S.clubTried && S.clubTried[cid]) ? 0.1 : 0;
      return clampNum(base + bonus + retry, 0.05, 0.95);
    }

    /* 生成抢社团的选项 */
    function buildClubGrabOpts() {
      const opts = [];
      // 展示 6 个社团（含热门与冷门），而不是 13 个，避免选项爆炸
      const hot = CLUBS.filter(c => c.pop >= 4);
      const cool = CLUBS.filter(c => c.pop <= 3);
      const pick = [...hot.sort(() => Math.random() - 0.5).slice(0, 3),
                    ...cool.sort(() => Math.random() - 0.5).slice(0, 3)]
        .sort(() => Math.random() - 0.5);

      pick.forEach(c => {
        const chance = Math.round(clubGrabChance(c.id) * 100);
        opts.push({
          t: `${c.icon} 抢「${c.n}」`,
          sub: `${c.cat} · 名额${c.pop >= 4 ? "紧张" : "充足"} · 成功率约 ${chance}%`,
          fn: () => {
            if (!Array.isArray(S.clubTried)) S.clubTried = [];
            S.clubTried.push(c.id);
            if (Math.random() < clubGrabChance(c.id)) {
              joinClub(c.id);
              showPopup({
                kind: "free", badge: "🎉 社团", title: `抢到了！${c.icon} ${c.n}`,
                body: `<div style="line-height:2">系统显示「报名成功」的那一刻，你在宿舍里叫出了声。<br><br>
                  ${c.desc}<br><br>
                  <span style="color:var(--dim);font-size:.85rem">此后每周三的社团课会有社团的事。坚持参加 6 次，可能有所收获。</span></div>`,
                options: [{t: "太好了", fn: () => {ensureActionPanel();}}]
              });
            } else {
              say(`😢 ${c.n} 名额满了，你慢了一步。`, "bad");
              showPopup({
                kind: "free", badge: "😢 社团", title: `没抢上 ${c.icon} ${c.n}`,
                body: `<div style="line-height:2">页面刷出来的时候，名额已经是灰的了。<br>
                  「${c.pop >= 4 ? "两百人抢三十个位置" : "今年报的人比往年多"}。」室友在旁边叹气。<br><br>
                  <span style="color:var(--dim);font-size:.85rem">下周还有一次机会，也可以看看别的社团。</span></div>`,
                options: [{t: "下周再试", fn: () => {ensureActionPanel();}}]
              });
            }
          }
        });
      });
      opts.push({t: "算了，不报了", sub: "把时间留给学习", fn: () => {
        S.clubSkip = true;
        S.clubSkipTerm = clampNum(S.term, 0, 9, 0);
        say("你退出了报名页面。这一年，你始终是个旁观者。", "sys");
        ensureActionPanel();
      }});
      return opts;
    }

    }

      {id: "cl_weiqi_2", w: 4, dist: "uniform", minGap: 5, slot: "clubday",

        t: "围棋社 · 终于赢了一盘", c: "第六盘，你赢了。\n赢的那一刻没什么感觉，只是松了口气。",
        opts: [
          {t: "再下一盘", run: ["悟性 +5", "心态 +5", "计数 club", "提示 你赢下了第二盘。!good"]},
          {t: "见好就收", run: ["心态 +4", "悟性 +3", "计数 club", "提示 你收了棋子，心里很稳。"]},
        ]},

      // ——— 摄影社 ———
      {id: "cl_photo_1", w: 5, dist: "uniform", minGap: 4, slot: "clubday",
        cond: S => S.club === "photo",
        t: "摄影社 · 等一束光", c: "为了拍教学楼，社长让你在操场上等了很久。\n「光不对，再等等。」",
        opts: [
          {t: "等下去", run: ["悟性 +5", "心态 +5", "压力 -4", "计数 club", "提示 云散开的一刻，红色教学楼被照得发亮。!good"]},
          {t: "随便拍一张走人", run: ["悟性 +1", "计数 club", "提示 你的照片灰蒙蒙的。"]},
        ]},
      {id: "cl_photo_2", w: 5, dist: "uniform", minGap: 5, slot: "clubday",
        cond: S => S.club === "photo",
        t: "摄影社 · 运动会的活", c: "运动会期间，摄影社全员上阵。\n你负责终点线，蹲在那里。",
        opts: [
          {t: "蹲一整天", run: ["健康 -4", "社交 +6", "悟性 +4", "计数 club", "提示 你拍到了冲线那一秒的表情。!good"]},
          {t: "拍会儿就溜", run: ["社交 -2", "悟性 +1", "计数 club", "提示 你回教室写了会儿作业。"]},
        ]},

      // ——— 编程社 ———
      {id: "cl_coding_1", w: 5, dist: "uniform", minGap: 4, slot: "clubday",
        cond: S => S.club === "coding",
        t: "编程社 · 调试", c: "机房里，你的程序跑了三遍都是错的。\n社长说：「别急，先看报错信息。」",
        opts: [
          {t: "一行行看报错", run: ["悟性 +6", "效率 +4", "健康 -3", "压力 +4", "计数 club", "提示 你找到了那个少写的括号。!good"]},
          {t: "抄社长的代码", run: ["悟性 +1", "效率 +2", "计数 club", "提示 程序跑通了，但你不太懂为什么。"]},
        ]},
      {id: "cl_coding_2", w: 5, dist: "uniform", minGap: 5, slot: "clubday",
        cond: S => S.club === "coding",
        t: "编程社 · 做出一个小东西", c: "你用几周时间写了一个小工具——\n能把全班的名字随机排座位的那种。",
        opts: [
          {t: "发给同学用", run: ["社交 +7", "心态 +6", "悟性 +4", "计数 club", "提示 有人问你：能不能也加个值日表功能？!good"]},
          {t: "自己留着", run: ["悟性 +5", "心态 +3", "计数 club", "提示 你把它存在了 U 盘里。"]},
        ]},
    ];

    /* 把社团事件并入主事件表（幂等） */
    (function mergeClubEvents() {
      if (typeof EVENTS === "undefined") return;
      CLUB_EVENTS.forEach(e => {
        if (!EVENTS.some(x => x.id === e.id)) EVENTS.push(e);
      });
    })();

    /* 社团每周加成 —— 在 weeklySettle 里调用 */
    function applyClubPerk() {
      if (!S || !S.club) return;
      const c = CLUB_MAP[S.club];
      if (!c || !c.perk) return;
      for (const k in c.perk) {
        const v = num(c.perk[k], 0);
        if (v) S.prop[k] = fixProp(k, num(S.prop[k], 0) + v);
      }
    }

    /* 社团参与次数累计到一定程度，可能获得天赋 */
    function checkClubTalent() {
      if (!S || !S.club) return;
      const c = CLUB_MAP[S.club];
      if (!c || !c.talent || !TALENTS[c.talent]) return;
      const n = num(S.cnt.club, 0);
      if (n >= 6 && !Talent.have(c.talent) && Math.random() < 0.35) {
        gainTalent(c.talent, `${c.n}的长期坚持`);
      }
    }

    /* 当前社团名（HUD 显示用） */
    function clubName() {
      return (S && S.club && CLUB_MAP[S.club]) ? CLUB_MAP[S.club].icon + CLUB_MAP[S.club].n : "";
    }
